apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-agent-ca
  namespace: argocd
spec:
  duration: 87600h
  issuerRef:
    group: cert-manager.io
    name: argocd-agent
    kind: Issuer
  privateKey:
    algorithm: RSA
    size: 4096
  commonName: argocd-agent-ca
  isCA: true
  secretName: argocd-hub-agent-ca
