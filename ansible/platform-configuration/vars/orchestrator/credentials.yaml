---
orchestrator_credentials:
  - name: OS-T-HubAAP
    description: OpenShell Test Hub Ansible Automation Platform (AAP) credentials
    credential_type: Ansible Automation Platform
    project: openshell-test
    inputs:
      username: "{{ aap_username }}"
      password: "{{ admin_secret_r.resources[0].data.password | b64decode }}"
    update_secrets: false
    labels:
      env: test
  - name: OS-P-HubAAP
    description: OpenShell Production Hub Ansible Automation Platform (AAP) credentials
    credential_type: Ansible Automation Platform
    project: openshell-prod
    inputs:
      username: "{{ aap_username }}"
      password: "{{ admin_secret_r.resources[0].data.password | b64decode }}"
    update_secrets: false
    labels:
      env: prod