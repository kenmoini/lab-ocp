global:
  compatibility:
    openshift:
      adaptSecurityContext: auto
auth:
  existingSecret: gitlab-redis
tls:
  enabled: true
  authClients: false
  # existingSecret: gitlab-redis-cache-serving-certs
  autoGenerated: true
  # existingSecret: ""
  certFilename: tls.crt
  certKeyFilename: tls.key
  certCAFilename: ca.crt
networkPolicy:
  enabled: true
  ingressNSMatchLabels:
    kubernetes.io/metadata.name: gitlab-system
  metrics:
    ingressNSMatchLabels:
      network.openshift.io/policy-group: monitoring
master:
  service:
    annotations:
      service.beta.openshift.io/serving-cert-secret-name: gitlab-redis-serving-certs
metrics:
  enabled: true
  # extraArgs:
  #   tls-client-key-file: "/etc/prometheus/secrets/metrics-client-certs/tls.key"
  #   tls-client-cert-file: "/etc/prometheus/secrets/metrics-client-certs/tls.crt"
  #   tls-ca-cert-file: "/etc/prometheus/secrets/metrics-client-ca/service-ca.crt"
  extraVolumes:
    - name: metrics-server-certs
      secret:
        secretName: gitlab-redis-metrics-client-certs
    - name: service-ca
      configMap:
        name: openshift-service-ca.crt
  extraVolumeMounts:
    - name: metrics-server-certs
      mountPath: /etc/prometheus/secrets/metrics-server-certs
      readOnly: true
    - name: service-ca
      mountPath: /etc/prometheus/secrets/service-ca
      readOnly: true
  service:
    annotations:
      service.beta.openshift.io/serving-cert-secret-name: gitlab-redis-metrics-client-certs
  serviceMonitor:
    enabled: true
    tlsConfig:
      ca:
        configMap:
          name: openshift-service-ca.crt
          key: service-ca.crt
      certFile: /etc/prometheus/secrets/metrics-server-certs/tls.crt
      caFile: /etc/prometheus/secrets/service-ca/service-ca.crt
      keyFile: /etc/prometheus/secrets/metrics-server-certs/tls.key