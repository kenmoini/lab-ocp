
installCertmanager: false
certmanager:
  installCRDs: false
prometheus:
  install: false
  rbac:
    create: false

global:
  time_zone: America/New_York
  edition: ce
  serviceAccount:
    enabled: true
    create: true
    automountServiceAccountToken: true
  monitoring:
    enabled: true
  ingress:
    configureCertmanager: false
    class: "openshift-default"
  gatewayApi:
    enabled: false
    installEnvoy: false
    configureCertmanager: false
  image:
    pullPolicy: Always  # You can drop this if you're using release tags.
    tagSuffix: -ubi # -ubi8 for GitLab 17.2 and earlier
  psql:
    host: gitlab-db-rw.gitlab-system.svc.cluster.local
    database: app
    username: app
    password:
      secret: gitlab-db-app
      key: password
  registry:
    bucket: gitlab-s3-registry
  appConfig:
    enableUsagePing: false
    usernameChangingEnabled: false
    lfs:
      bucket: gitlab-s3-lfs
      connection:
        secret: gitlab-s3-lfs-conn
        key: connection
    backups:
      bucket: gitlab-s3-backups
      connection:
        secret: gitlab-s3-backups-conn
        key: connection
    uploads:
      bucket: gitlab-s3-uploads
      connection:
        secret: gitlab-s3-uploads-conn
        key: connection
    artifacts:
      bucket: gitlab-s3-artifacts
      connection:
        secret: gitlab-s3-artifacts-conn
        key: connection
    packages:
      bucket: gitlab-s3-packages
      connection:
        secret: gitlab-s3-packages-conn
        key: connection

registry:
  storage:
    secret: gitlab-s3-registry-conn
    key: connection