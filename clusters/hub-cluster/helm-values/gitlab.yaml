
installCertmanager: false
certmanager:
  installCRDs: false
prometheus:
  install: false
  rbac:
    create: false
upgradeCheck:
  enabled: false

global:
  time_zone: America/New_York
  edition: ce
  hosts:
    domain: apps.tri-force.lab.kemo.network
  certificates:
    customCAs:
      - secret: combo-ca
        keys:
          - gitlab.apps.tri-force.lab.kemo.network.crt
          - service-ca.crt
  serviceAccount:
    enabled: true
    create: true
    automountServiceAccountToken: true
  monitoring:
    enabled: true
  ingress:
    configureCertmanager: false
    class: "openshift-default"
  gatewayApi:
    enabled: false
    installEnvoy: false
    configureCertmanager: false
  image:
    pullPolicy: Always  # You can drop this if you're using release tags.
    tagSuffix: -ubi # -ubi8 for GitLab 17.2 and earlier
  psql:
    host: gitlab-db-rw.gitlab-system.svc.cluster.local
    database: app
    username: app
    port: 5432
    password:
      useSecret: true
      secret: gitlab-db-app
      key: password
  redis:
    host: 'gitlab-redis-master'
    port: 6379
    username: default
    auth:
      secret: 'gitlab-redis'
      key: redis-password
      enabled: true
  registry:
    bucket: gitlab-s3-registry
  appConfig:
    enableUsagePing: false
    usernameChangingEnabled: false
    lfs:
      bucket: gitlab-s3-lfs
      connection:
        secret: gitlab-s3-lfs-conn
        key: connection
    artifacts:
      bucket: gitlab-s3-artifacts
      connection:
        secret: gitlab-s3-artifacts-conn
        key: connection
    uploads:
      bucket: gitlab-s3-uploads
      connection:
        secret: gitlab-s3-uploads-conn
        key: connection
    packages:
      bucket: gitlab-s3-packages
      connection:
        secret: gitlab-s3-packages-conn
        key: connection
    externalDiffs:
      enabled: true
      bucket: gitlab-s3-ext-diffs
      connection:
        secret: gitlab-s3-ext-diffs-conn
        key: connection
    terraformState:
      enabled: false
      bucket: gitlab-s3-tf-state
      connection:
        secret: gitlab-s3-tf-state-conn
        key: connection
    ciSecureFiles:
      enabled: true
      bucket: gitlab-s3-secure-ci
      connection:
        secret: gitlab-s3-secure-ci-conn
        key: connection
    agentPlanContent:
      enabled: true
      bucket: gitlab-s3-agent-plan
      connection:
        secret: gitlab-s3-agent-plan-conn
        key: connection
    ciCatalogBundles:
      enabled: true
      bucket: gitlab-s3-ci-catalog
      connection:
        secret: gitlab-s3-ci-catalog-conn
        key: connection
    dependencyProxy:
      enabled: true
      bucket: gitlab-s3-dep-proxy
      connection:
        secret: gitlab-s3-dep-proxy-conn
        key: connection
    backups:
      bucket: gitlab-s3-backups
      connection:
        secret: gitlab-s3-backups-conn
        key: connection
    toolbox:
      bucket: gitlab-s3-toolbox
      connection:
        secret: gitlab-s3-toolbox-conn
        key: connection

registry:
  storage:
    secret: gitlab-s3-registry-conn
    key: connection
  hpa:
    minReplicas: 1
    maxReplicas: 1

gitlab:
  webservice:
    minReplicas: 1
    maxReplicas: 1
  sidekiq:
    minReplicas: 1
    maxReplicas: 1
  gitlab-shell:
    minReplicas: 1
    maxReplicas: 1
  # gitaly:
  #   resources:
  #     requests:
  #         cpu: 50m
  # shared-secrets:
  #   resources:
  #       requests:
  #         cpu: 10m
  # migrations:
  #   resources:
  #     requests:
  #       cpu: 10m
  # toolbox:
  #   resources:
  #     requests:
  #       cpu: 10m

gitlab-runner:
  serviceAccount:
    create: true
  metrics:
    enabled: true
    podMonitor:
      enabled: true
  volumeMounts:
    - name: ca-certs
      mountPath: /etc/ssl/certs/ca-certificates.crt
      subPath: full-ca-bundle.crt
  volumes:
    - name: ca-certs
      secret:
        secretName: combo-ca