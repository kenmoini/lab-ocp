
installCertmanager: false
certmanager:
  installCRDs: false
prometheus:
  install: false
  rbac:
    create: false
upgradeCheck:
  enabled: true
nginx-ingress:
  enabled: false

global:
  time_zone: America/New_York
  edition: ee
  hosts:
    domain: gitlab.tri-force.lab.kemo.network
    https: true
    gitlab:
      name: gitlab.tri-force.lab.kemo.network
    kas:
      name: kas.gitlab.tri-force.lab.kemo.network
    registry:
      name: registry.gitlab.tri-force.lab.kemo.network
    pages:
      name: pages.gitlab.tri-force.lab.kemo.network
    ssh: ""
  certificates:
    customCAs:
      - secret: combo-ca
        keys:
          - gitlab.apps.tri-force.lab.kemo.network.crt
          - service-ca.crt
          - redis-tls-ca.crt
          - redis-registry-cache-tls-ca.crt
  serviceAccount:
    enabled: true
    create: true
    automountServiceAccountToken: true
  monitoring:
    enabled: true
  ingress:
    configureCertmanager: false
    class: "openshift-default"
  gatewayApi:
    enabled: true
    installEnvoy: false
    configureCertmanager: false
    httpToHttpsRedirect: true
    gatewayRef:
      name: gitlab-gateway
      namespace: openshift-ingress
  image:
    pullPolicy: Always  # You can drop this if you're using release tags.
    tagSuffix: -ubi # -ubi8 for GitLab 17.2 and earlier
  psql:
    host: gitlab-db-rw.gitlab-infra.svc.cluster.local
    database: app
    username: app
    port: 5432
    password:
      useSecret: true
      secret: gitlab-db-app
      key: password
  redis:
    host: gitlab-redis-master.gitlab-infra.svc.cluster.local
    port: 6379
    scheme: rediss
    username: default
    user: default
    redisTLS:
      caFile:
        secret: redis-tls-ca
        key: ca.crt
    auth:
      secret: 'gitlab-redis'
      key: redis-password
      enabled: true
  registry:
    bucket: gitlab-s3-registry
    redis:
      cache:
        host: gitlab-redis-registry-cache.gitlab-infra.svc.cluster.local
        port: 6379
        scheme: rediss
        username: default
        user: default
        password:
          secret: gitlab-redis-cache
          key: redis-password
  appConfig:
    enableUsagePing: false
    usernameChangingEnabled: false
    lfs:
      bucket: gitlab-s3-lfs
      connection:
        secret: gitlab-s3-lfs-conn
        key: connection
    artifacts:
      bucket: gitlab-s3-artifacts
      connection:
        secret: gitlab-s3-artifacts-conn
        key: connection
    uploads:
      bucket: gitlab-s3-uploads
      connection:
        secret: gitlab-s3-uploads-conn
        key: connection
    packages:
      bucket: gitlab-s3-packages
      connection:
        secret: gitlab-s3-packages-conn
        key: connection
    externalDiffs:
      enabled: true
      bucket: gitlab-s3-ext-diffs
      connection:
        secret: gitlab-s3-ext-diffs-conn
        key: connection
    terraformState:
      enabled: false
      bucket: gitlab-s3-tf-state
      connection:
        secret: gitlab-s3-tf-state-conn
        key: connection
    ciSecureFiles:
      enabled: true
      bucket: gitlab-s3-secure-ci
      connection:
        secret: gitlab-s3-secure-ci-conn
        key: connection
    agentPlanContent:
      enabled: true
      bucket: gitlab-s3-agent-plan
      connection:
        secret: gitlab-s3-agent-plan-conn
        key: connection
    ciCatalogBundles:
      enabled: true
      bucket: gitlab-s3-ci-catalog
      connection:
        secret: gitlab-s3-ci-catalog-conn
        key: connection
    dependencyProxy:
      enabled: true
      bucket: gitlab-s3-dep-proxy
      connection:
        secret: gitlab-s3-dep-proxy-conn
        key: connection
    backups:
      bucket: gitlab-s3-backups
      connection:
        secret: gitlab-s3-backups-conn
        key: connection
    omniauth:
      enabled: true
      allowSingleSignOn:
        - oauth2_generic
        - openid_connect
      blockAutoCreatedUsers: false
      autoLinkUser: true
      providers:
        - secret: gitlab-keycloak
          key: provider
registry:
  bucket: gitlab-s3-registry
  cache:
    username: default
    user: default
    scheme: rediss
    password:
      secret: gitlab-redis-cache
      key: redis-password
  storage:
    secret: gitlab-s3-registry-conn
    key: connection
  hpa:
    minReplicas: 1
    maxReplicas: 1
  gatewayRoute:
    annotations:
      pdns.kemo.dev: "enabled"
      pdns-internal.kemo.dev/hostname: "registry.gitlab.tri-force.lab.kemo.network"

gitlab:
  kas:
    gatewayRoute:
      annotations:
        pdns.kemo.dev: "enabled"
        pdns-internal.kemo.dev/hostname: "kas.gitlab.tri-force.lab.kemo.network"
  webservice:
    minReplicas: 1
    maxReplicas: 1
    gatewayRoute:
      annotations:
        pdns.kemo.dev: "enabled"
        pdns-internal.kemo.dev/hostname: "gitlab.tri-force.lab.kemo.network"
  sidekiq:
    minReplicas: 1
    maxReplicas: 1
  gitlab-shell:
    minReplicas: 1
    maxReplicas: 1
    gatewayRoute:
      enabled: false
  # gitaly:
  #   resources:
  #     requests:
  #         cpu: 50m
  # shared-secrets:
  #   resources:
  #       requests:
  #         cpu: 10m
  # migrations:
  #   resources:
  #     requests:
  #       cpu: 10m
  toolbox:
    backups:
      objectStorage:
        config:
          secret: gitlab-s3-toolbox-conn
          key: connection
        backend: s3
        bucket: gitlab-s3-toolbox
  #   resources:
  #     requests:
  #       cpu: 10m

gitlab-runner:
  serviceAccount:
    create: true
  metrics:
    enabled: true
    podMonitor:
      enabled: true
  volumeMounts:
    - name: ca-certs
      mountPath: /etc/ssl/certs/ca-certificates.crt
      subPath: full-ca-bundle.crt
  volumes:
    - name: ca-certs
      secret:
        secretName: combo-ca
  runners:
    config: |
      [[runners]]
        name = "my-kubernetes-runner"
        environment = ["FF_USE_ADVANCED_POD_SPEC_CONFIGURATION=true", "HOME=/repo"]
        # Increase this value to prevent long polling deadlocks
        request_concurrency = 4
        # Ensure builds take place in a writeable space
        builds_dir = "/repo"
        
        [runners.kubernetes]
          image = "ubuntu:22.04"
          automount_service_account_token = true
          host_users = false
          privileged = true
          allowPrivilegeEscalation = true
          service_account = "gitlab-gitlab-runner"
        [[runners.kubernetes.volumes.empty_dir]]
          name = "repo"
          mount_path = "/repo"

        [[runners.kubernetes.pod_spec]]
          name = "procmount"
          patch = '''
            containers:
            - name: build
              securityContext:
                procMount: Unmasked
          '''
          patch_type = "strategic"

        [[runners.kubernetes.pod_spec]]
          name = "hostUsers"
          patch = '''
            [{"op": "add", "path": "/hostUsers", "value": false}]
          '''
          patch_type = "json"

        [runners.kubernetes.build_container_security_context]
          [runners.kubernetes.build_container_security_context.capabilities]
            add = ["NET_ADMIN", "SETUID", "SETGID", "SYS_ADMIN", "MKNOD", "CHOWN"]

        [[runners.kubernetes.volumes.secret]]
          name = "combo-ca"
          mount_path = "/etc/ssl/certs/ca-certificates.crt"
          sub_path = "full-ca-bundle.crt"
          read_only = true