# A simple dev deployment of RustFS with enablement of sending bucket notifications
mode:
  standalone:
    enabled: true
  distributed:
    enabled: false

secret:
  existingSecret: rustfs-root-key

tls:
  enabled: false

metrics:
  enabled: true

extraEnv:
  - name: RUSTFS_NOTIFY_ENABLE
    value: "true"
  - name: RUSTFS_NOTIFY_KAFKA_ENABLE_URSULA
    value: "true"
  - name: RUSTFS_OUTBOUND_ALLOW_ORIGINS
    value: "*"

extraEnvFrom:
  - configMapRef:
      name: kafka-notification-config
      optional: true

storageclass:
  name: ocs-storagecluster-cephfs
  dataStorageSize: 20Gi

ingress:
  className: openshift-default
  hosts:
  - host: rustfs.apps.tri-force.lab.kemo.network
    paths:
      - path: /
        pathType: ImplementationSpecific

extraManifests:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: kafka-notification-config
      namespace: rustfs
    data:
      RUSTFS_NOTIFY_KAFKA_BROKERS_URSULA: "ursula-odf-kafka-bootstrap.ursula-infra.svc.cluster.local:9092"
      RUSTFS_NOTIFY_KAFKA_TOPIC_URSULA: "ursula.engagement-events"