
policy: create-only
sources:
  - service
  - ingress
  - crd
  - openshift-route
domainFilters:
  - lab.kemo.network
  - lab.kemo.dev
  - kemo.labs
txtOwnerId: external-dns
provider:
  name: pdns
extraArgs:
  - --pdns-server=http://192.168.42.2:8081
  - --pdns-server-id=localhost
  - --pdns-api-key=${PDNS_API_KEY}
extraVolumes:
  - name: pdns-api-key
    secret:
      secretName: pdns-api-key
  - name: trusted-cabundle
    configMap:
      name: trusted-cabundle
extraVolumeMounts:
  - name: trusted-cabundle
    mountPath: /etc/ssl/certs/custom-ca.crt
    readOnly: true
    subPath: ca-bundle.crt
env:
  - name: PDNS_API_KEY
    valueFrom:
      secretKeyRef:
        name: pdns-api-key
        key: api-key