
policy: create-only
sources:
  - service
  - ingress
  - crd
  - openshift-route
domainFilters:
  - lab.kemo.network
  - lab.kemo.dev
  - kemo.labs
txtOwnerId: external-dns
provider:
  name: pdns
extraArgs:
  - --pdns-server=https://pdns-auth.apps.lab.kemo.dev
  - --pdns-server-id=localhost
  - --pdns-api-key=${PDNS_API_KEY}
extraVolumes:
  - name: pdns-api-key
    secret:
      secretName: pdns-api-key
env:
  - name: PDNS_API_KEY
    valueFrom:
      secretKeyRef:
        name: pdns-api-key
        key: api-key