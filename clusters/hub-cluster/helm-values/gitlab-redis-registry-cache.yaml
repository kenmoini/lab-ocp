global:
  compatibility:
    openshift:
      adaptSecurityContext: auto
auth:
  existingSecret: gitlab-redis-registry-cache
networkPolicy:
  enabled: true
  ingressNSMatchLabels:
    kubernetes.io/metadata.name: gitlab-system
  metrics:
    ingressNSMatchLabels:
      network.openshift.io/policy-group: monitoring
metrics:
  enabled: true
  extraArgs:
    tls-server-key-file: "/etc/prometheus/secrets/metrics-client-certs/tls.key"
    tls-server-cert-file: "/etc/prometheus/secrets/metrics-client-certs/tls.crt"
    tls-server-ca-cert-file: "/etc/prometheus/secrets/metrics-client-ca/service-ca.crt"
  extraVolumes:
    - name: metrics-client-certs
      secret:
        secretName: gitlab-cache-metrics-client-certs
    - name: metrics-client-ca
      configMap:
        name: openshift-service-ca.crt
  extraVolumeMounts:
    - name: metrics-client-certs
      mountPath: /etc/prometheus/secrets/metrics-client-certs
      readOnly: true
    - name: metrics-client-ca
      mountPath: /etc/prometheus/secrets/metrics-client-ca
      readOnly: true
  service:
    annotations:
      service.beta.openshift.io/serving-cert-secret-name: gitlab-cache-metrics-client-certs
  serviceMonitor:
    enabled: true
    tlsConfig:
      certFile: /etc/prometheus/secrets/metrics-client-certs/tls.crt
      caFile: /etc/prometheus/secrets/metrics-client-ca/service-ca.crt
      keyFile: /etc/prometheus/secrets/metrics-client-certs/tls.key