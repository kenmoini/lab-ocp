global:
  compatibility:
    openshift:
      adaptSecurityContext: auto
auth:
  existingSecret: gitlab-redis-registry-cache
tls:
  enabled: true
  authClients: false
  existingSecret: gitlab-redis-cache-serving-certs
  certFilename: tls.crt
  certKeyFilename: tls.key
networkPolicy:
  enabled: true
  ingressNSMatchLabels:
    kubernetes.io/metadata.name: gitlab-system
  metrics:
    ingressNSMatchLabels:
      network.openshift.io/policy-group: monitoring
master:
  service:
    annotations:
      service.beta.openshift.io/serving-cert-secret-name: gitlab-redis-cache-serving-certs
metrics:
  enabled: true
  extraArgs:
    tls-server-key-file: "/etc/prometheus/secrets/metrics-server-certs/tls.key"
    tls-server-cert-file: "/etc/prometheus/secrets/metrics-server-certs/tls.crt"
    # tls-server-ca-cert-file: "/etc/prometheus/configmaps/service-ca/service-ca.crt"
  extraVolumes:
    - name: metrics-server-certs
      secret:
        secretName: gitlab-cache-metrics-serving-certs
    - name: service-ca
      configMap:
        name: openshift-service-ca.crt
  extraVolumeMounts:
    - name: metrics-server-certs
      mountPath: /etc/prometheus/secrets/metrics-server-certs
      readOnly: true
    - name: service-ca
      mountPath: /etc/prometheus/configmaps/service-ca
      readOnly: true
  service:
    annotations:
      service.beta.openshift.io/serving-cert-secret-name: gitlab-cache-metrics-serving-certs
  serviceMonitor:
    enabled: true
    tlsConfig:
      ca:
        configMap:
          name: openshift-service-ca.crt
          key: service-ca.crt
      caFile: /etc/prometheus/configmaps/service-ca/service-ca.crt
      certFile: /etc/prometheus/secrets/metrics-server-certs/tls.crt
      keyFile: /etc/prometheus/secrets/metrics-server-certs/tls.key