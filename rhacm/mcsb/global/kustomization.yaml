---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - automation-orchestrator.yaml
  - kube-system.yaml
  - open-cluster-management-observability.yaml
  - open-cluster-management-policies.yaml
  - openshift-monitoring.yaml
  - quay.yaml
  # the stackrox namespace must exist for the stackrox policies to work - we make this with a policy
  #- stackrox.yaml

commonAnnotations:
  argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true