---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: ensembles-gitlab
  #namespace: gitlab-infra
placementRef:
  name: ensemble-gitlab
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
subjects:
  - name: gitlab-chart-db-copy
    apiGroup: policy.open-cluster-management.io
    kind: Policy
  - name: gitlab-chart-redis-copy
    apiGroup: policy.open-cluster-management.io
    kind: Policy
  - name: gitlab-chart-cache-copy
    apiGroup: policy.open-cluster-management.io
    kind: Policy
