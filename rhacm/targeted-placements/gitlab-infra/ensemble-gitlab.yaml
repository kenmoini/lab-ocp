---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: ensemble-gitlab
  # namespace: gitlab-infra
spec:
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: ensemble/gitlab
              operator: In
              values:
                - "true"
                - "enable"
                - "enabled"