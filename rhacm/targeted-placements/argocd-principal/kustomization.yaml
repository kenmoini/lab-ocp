---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd-principal

resources:
  - argocd-agent-auto_binding.yaml
  - argocd-agent-auto.yaml
  - argocd-agent-managed_binding.yaml
  - argocd-agent-managed.yaml
  - argocd-agent-principal_binding.yaml
  - argocd-agent-principal.yaml

commonAnnotations:
  argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true