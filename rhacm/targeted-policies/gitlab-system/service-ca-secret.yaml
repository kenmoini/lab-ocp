---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: gitlab-svc-ca-secret
  # namespace: gitlab-system
  annotations:
    policy.open-cluster-management.io/description: Creates the Service CA Secret to be used by the GitLab instances
    policy.open-cluster-management.io/categories: OCPOM - OpenShift Operator Management
    policy.open-cluster-management.io/standards: Kemo Labs 2026
    policy.open-cluster-management.io/controls: OLM-INST - Operator Instance
spec:
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: gitlab-svc-ca-secret
        spec:
          remediationAction: enforce
          severity: critical
          pruneObjectBehavior: DeleteIfCreated
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: service-ca
                  namespace: gitlab-system
                type: Opaque
                stringData:
                  service-ca.crt: '{{ fromConfigMap "openshift-service-ca" "signing-cabundle" "ca-bundle.crt" }}'
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: gitlab-root-ca-secret
        spec:
          remediationAction: enforce
          severity: critical
          pruneObjectBehavior: DeleteIfCreated
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: trusted-root-ca
                  namespace: gitlab-system
                type: Opaque
                stringData:
                  ca-bundle.crt: '{{ fromConfigMap "openshift-config-managed" "trusted-ca-bundle" "ca-bundle.crt" }}'
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: gitlab-joint-ca-secret
        spec:
          remediationAction: enforce
          severity: critical
          pruneObjectBehavior: DeleteIfCreated
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: combo-ca
                  namespace: gitlab-system
                type: Opaque
                stringData:
                  service-ca.crt: '{{ fromConfigMap "openshift-service-ca" "signing-cabundle" "ca-bundle.crt" }}'
                  ca-bundle.crt: '{{ fromConfigMap "openshift-config-managed" "trusted-ca-bundle" "ca-bundle.crt" }}'
                  full-ca-bundle.crt: |
                    {{ fromConfigMap "openshift-config-managed" "trusted-ca-bundle" "ca-bundle.crt" }}
                    {{ fromConfigMap "openshift-service-ca" "signing-cabundle" "ca-bundle.crt" }}