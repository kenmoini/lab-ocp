---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: gitlab-chart-s3-formatter
  # namespace: gitlab-system
  annotations:
    policy.open-cluster-management.io/description: Reconfigures the GitLab S3 OBC Secret into a new one to be used by the GitLab instances
    policy.open-cluster-management.io/categories: OCPOM - OpenShift Operator Management
    policy.open-cluster-management.io/standards: Kemo Labs 2026
    policy.open-cluster-management.io/controls: OLM-INST - Operator Instance
spec:
  disabled: false
  policy-templates:
    - extraDependencies:
        - apiVersion: policy.open-cluster-management.io/v1
          kind: Policy
          name: gitlab-chart-s3
          namespace: "open-cluster-management-policies"
          compliance: Compliant
      objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: gitlab-s3-obc-secret
        spec:
          remediationAction: enforce
          severity: critical
          pruneObjectBehavior: DeleteIfCreated
          object-templates-raw: |
            {{- range $key := (list "general" "pages" "registry" "uploads" "artifacts" "packages" "backups" "lfs" "toolbox" "secure-ci" "agent-plan" "ci-catalog" "dep-proxy" "ext-diffs") }}
            - complianceType: musthave
              objectDefinition:
                kind: Secret
                metadata:
                  name: gitlab-s3-{{ $key }}-conn
                  namespace: gitlab-system
                type: Opaque
                stringData:
                  connection: |
                    s3:
                      bucket: gitlab-s3-{{ $key }}
                      accesskey: '{{ fromSecret "gitlab-system" (list "gitlab-s3" $key | join "-") "AWS_ACCESS_KEY_ID" | base64dec }}'
                      secretkey: '{{ fromSecret "gitlab-system" (list "gitlab-s3" $key | join "-") "AWS_SECRET_ACCESS_KEY" | base64dec }}'
                      region: the-moon
                      regionendpoint: 'https://s3.openshift-storage.svc'
                      v4auth: true
            {{- end }}
