---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: aa-spoke-managed-copy-creds
  # namespace: argocd-principal
  annotations:
    policy.open-cluster-management.io/description: Creates and distributes the ArgoCD Agent credentials to Managed Clusters
    policy.open-cluster-management.io/categories: OCPOM - OpenShift Operator Management
    policy.open-cluster-management.io/standards: Kemo Labs 2026
    policy.open-cluster-management.io/controls: OLM-SUB - Operator Installation
spec:
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: aa-spoke-managed-copy-creds
        spec:
          remediationAction: enforce
          severity: critical
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: argocd-agent-client-tls
                  namespace: "argocd-agent-{{hub .ManagedClusterName hub}}"
                type: kubernetes.io/tls
                data:
                  tls.crt: '{{hub (fromSecret "argocd-principal" (printf "aac-%s" .ManagedClusterName) "tls.crt") hub}}'
                  tls.key: '{{hub (fromSecret "argocd-principal" (printf "aac-%s" .ManagedClusterName) "tls.key") hub}}'