---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: aa-prncpl-jwt-format
  # namespace: argocd-principal
  annotations:
    policy.open-cluster-management.io/description: Converts the TLS pair generated by Cert-Manager into the format expected in the JWT for the ArgoCD Agent Principal
    policy.open-cluster-management.io/categories: OCPOM - OpenShift Operator Management
    policy.open-cluster-management.io/standards: Kemo Labs 2026
    policy.open-cluster-management.io/controls: OLM-SUB - Operator Installation
spec:
  disabled: false
  policy-templates:
    - extraDependencies:
        - apiVersion: policy.open-cluster-management.io/v1
          kind: ConfigurationPolicy
          name: agent-prncpl-jwt-tls
          namespace: ""
          compliance: Compliant
      objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: agent-prncpl-jwt-format
        spec:
          remediationAction: enforce
          severity: critical
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: argocd-agent-jwt
                  namespace: argocd-principal
                type: Opaque
                data:
                  jwt.key: '{{ (lookup "v1" "Secret" "argocd-principal" "argocd-agent-jwt-tls").data["tls.key"] }}'
