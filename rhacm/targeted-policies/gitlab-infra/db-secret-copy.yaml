---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: gitlab-chart-db-copy
  # namespace: gitlab-infra
  annotations:
    policy.open-cluster-management.io/description: Copies the DB Secret into a new one to be used by the GitLab instances
    policy.open-cluster-management.io/categories: OCPOM - OpenShift Operator Management
    policy.open-cluster-management.io/standards: Kemo Labs 2026
    policy.open-cluster-management.io/controls: OLM-INST - Operator Instance
spec:
  disabled: false
  policy-templates:
    - extraDependencies:
        - apiVersion: policy.open-cluster-management.io/v1
          kind: Policy
          name: gitlab-chart-db
          namespace: "open-cluster-management-policies"
          compliance: Compliant
      objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: gitlab-db-secret-copy
        spec:
          remediationAction: enforce
          severity: critical
          pruneObjectBehavior: DeleteIfCreated
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: gitlab-db-app
                  namespace: gitlab-system
                type: Opaque
                data:
                  password: '{{ fromSecret "gitlab-infra" "gitlab-db-app" "password" }}'
