---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: gitlab-chart-cache-copy
  # namespace: gitlab-infra
  annotations:
    policy.open-cluster-management.io/description: Copies the Cache Secret into a new one to be used by the GitLab instances
    policy.open-cluster-management.io/categories: OCPOM - OpenShift Operator Management
    policy.open-cluster-management.io/standards: Kemo Labs 2026
    policy.open-cluster-management.io/controls: OLM-INST - Operator Instance
spec:
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: gitlab-cache-secret-copy
        spec:
          remediationAction: enforce
          severity: critical
          pruneObjectBehavior: DeleteIfCreated
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: gitlab-redis-cache
                  namespace: gitlab-system
                type: Opaque
                data:
                  redis-password: '{{ fromSecret "gitlab-infra" "gitlab-redis-registry-cache" "redis-password" }}'
