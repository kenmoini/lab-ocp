apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: check-oauth-idps
  annotations:
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: SC System and Communications Protection
    policy.open-cluster-management.io/controls: SC-1 System and Communications Protection Policy and Procedures
spec:
  disabled: false
  policy-templates:

    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: check-oauth-idps
        spec:
          remediationAction: inform
          severity: high
          object-templates-raw: |
            {{- $oauthConfig := lookup "config.openshift.io/v1" "OAuth" "" "cluster" }}
            {{- if eq $oauthConfig.spec.identityProviders nil }}
            - complianceType: mustnothave
              objectDefinition:
                apiVersion: config.openshift.io/v1
                kind: OAuth
                metadata:
                  name: cluster
                spec:
                  identityProviders: []
            {{- end }}