            #       namespace: gitlab-system
            #     spec:
            #       parentRefs:
            #         - name: gitlab-gateway
            #           namespace: openshift-ingress
            #           kind: Gateway
            #           group: gateway.networking.k8s.io
            #       hostnames:
            #         - gitlab.tri-force.lab.kemo.network
            #       rules:
            #         - backendRefs:
            #             - name: gitlab-webservice-default
            #               namespace: gitlab-system
            #               kind: Service
            #               port: 8181
            #           matches:
            #             - path:
            #                 type: PathPrefix
            #                 value: '/'
