---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: gitlab-chart-ingress
  annotations:
    policy.open-cluster-management.io/description: Deploys ingress resources needed to run GitLab on OpenShift via the Helm chart
    policy.open-cluster-management.io/categories: OCPOM - OpenShift Operator Management
    policy.open-cluster-management.io/standards: Kemo Labs 2026
    policy.open-cluster-management.io/controls: OLM-INST - Operator Instance
spec:
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: gitlab-gateway
        spec:
          remediationAction: enforce
          severity: high
          pruneObjectBehavior: DeleteIfCreated
          object-templates:
            - complianceType: musthave
              objectDefinition:
                kind: ConfigMap
                apiVersion: v1
                metadata:
                  name: gitlab-gateway-config
                  namespace: openshift-ingress
                data:
                  service: |
                    metadata:
                      annotations:
                        pdns.kemo.dev: "enabled"
                        pdns-internal.kemo.dev/hostname: "gitlab.apps.tri-force.lab.kemo.network"
                    spec:
                      type: LoadBalancer

            - complianceType: musthave
              objectDefinition:
                apiVersion: gateway.networking.k8s.io/v1
                kind: Gateway
                metadata:
                  name: gitlab-gateway
                  namespace: openshift-ingress
                spec:
                  gatewayClassName: openshift-default
                  infrastructure:
                    parametersRef:
                      group: ''
                      kind: ConfigMap
                      name: gitlab-gateway-config
                  listeners:
                    - allowedRoutes:
                        namespaces:
                          from: Selector
                          selector:
                            matchLabels:
                              kubernetes.io/metadata.name: gitlab-system
                      hostname: gitlab.apps.tri-force.lab.kemo.network
                      name: http
                      port: 80
                      protocol: HTTP
                    - allowedRoutes:
                        namespaces:
                          from: Selector
                          selector:
                            matchLabels:
                              kubernetes.io/metadata.name: gitlab-system
                      hostname: gitlab.apps.tri-force.lab.kemo.network
                      name: https
                      port: 443
                      protocol: HTTPS
                      tls:
                        certificateRefs:
                          - group: ''
                            kind: Secret
                            name: ingress-lb-tls
                        mode: Terminate

            - complianceType: musthave
              objectDefinition:
                apiVersion: gateway.networking.k8s.io/v1
                kind: HTTPRoute
                metadata:
                  name: gitlab-httpsroute
                  namespace: gitlab-system
                spec:
                  parentRefs:
                    - name: gitlab-gateway
                      namespace: openshift-ingress
                      kind: Gateway
                      group: gateway.networking.k8s.io
                  hostnames:
                    - gitlab.apps.tri-force.lab.kemo.network
                  rules:
                    - backendRefs:
                        - name: gitlab-webservice-default
                          namespace: gitlab-system
                          kind: Service
                          port: 8181
                      matches:
                        - path:
                            type: PathPrefix
                            value: '/'
