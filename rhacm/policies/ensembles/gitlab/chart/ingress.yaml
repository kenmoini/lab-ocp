---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: gitlab-chart-ingress
  annotations:
    policy.open-cluster-management.io/description: Deploys ingress resources needed to run GitLab on OpenShift via the Helm chart
    policy.open-cluster-management.io/categories: OCPOM - OpenShift Operator Management
    policy.open-cluster-management.io/standards: Kemo Labs 2026
    policy.open-cluster-management.io/controls: OLM-INST - Operator Instance
spec:
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: gitlab-gateway
        spec:
          remediationAction: enforce
          severity: high
          pruneObjectBehavior: DeleteIfCreated
          object-templates:
            - complianceType: musthave
              objectDefinition:
                kind: ConfigMap
                apiVersion: v1
                metadata:
                  name: gitlab-gateway-config
                  namespace: openshift-ingress
                data:
                  service: |
                    metadata:
                      annotations:
                        pdns.kemo.dev: "enabled"
                        pdns-internal.kemo.dev/hostname: "*.gitlab.tri-force.lab.kemo.network"
                    spec:
                      type: LoadBalancer

            - complianceType: musthave
              recreateOption: IfRequired
              objectDefinition:
                apiVersion: gateway.networking.k8s.io/v1
                kind: Gateway
                metadata:
                  name: gitlab-gateway
                  namespace: openshift-ingress
                spec:
                  gatewayClassName: openshift-default
                  infrastructure:
                    parametersRef:
                      group: ''
                      kind: ConfigMap
                      name: gitlab-gateway-config
                  listeners:
                    - allowedRoutes:
                        namespaces:
                          from: Selector
                          selector:
                            matchLabels:
                              kubernetes.io/metadata.name: gitlab-system
                      name: gitlab-ssh
                      port: 22
                      protocol: TCP

                    - allowedRoutes:
                        namespaces:
                          from: Selector
                          selector:
                            matchLabels:
                              kubernetes.io/metadata.name: gitlab-system
                      hostname: gitlab.tri-force.lab.kemo.network
                      name: http-default
                      port: 80
                      protocol: HTTP

                    - allowedRoutes:
                        namespaces:
                          from: Selector
                          selector:
                            matchLabels:
                              kubernetes.io/metadata.name: gitlab-system
                      hostname: gitlab.tri-force.lab.kemo.network
                      name: gitlab-web
                      port: 443
                      protocol: HTTPS
                      tls:
                        certificateRefs:
                          - group: ''
                            kind: Secret
                            name: ingress-lb-tls
                        mode: Terminate

                    - allowedRoutes:
                        namespaces:
                          from: Selector
                          selector:
                            matchLabels:
                              kubernetes.io/metadata.name: gitlab-system
                      hostname: registry.gitlab.tri-force.lab.kemo.network
                      name: registry-web
                      port: 443
                      protocol: HTTPS
                      tls:
                        certificateRefs:
                          - group: ''
                            kind: Secret
                            name: ingress-lb-tls
                        mode: Terminate

                    - allowedRoutes:
                        namespaces:
                          from: Selector
                          selector:
                            matchLabels:
                              kubernetes.io/metadata.name: gitlab-system
                      hostname: kas.gitlab.tri-force.lab.kemo.network
                      name: kas-web
                      port: 443
                      protocol: HTTPS
                      tls:
                        certificateRefs:
                          - group: ''
                            kind: Secret
                            name: ingress-lb-tls
                        mode: Terminate

                    - allowedRoutes:
                        namespaces:
                          from: Selector
                          selector:
                            matchLabels:
                              kubernetes.io/metadata.name: gitlab-system
                      hostname: pages.gitlab.tri-force.lab.kemo.network
                      name: pages-web
                      port: 443
                      protocol: HTTPS
                      tls:
                        certificateRefs:
                          - group: ''
                            kind: Secret
                            name: ingress-lb-tls
                        mode: Terminate

            # - complianceType: musthave
            #   objectDefinition:
            #     apiVersion: gateway.networking.k8s.io/v1
            #     kind: HTTPRoute
