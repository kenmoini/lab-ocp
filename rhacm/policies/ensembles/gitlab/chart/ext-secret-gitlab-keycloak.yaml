---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: gitlab-chart-keycloak-secrets
  annotations:
    policy.open-cluster-management.io/description: Create ExternalSecrets for Keycloak needed to run GitLab on OpenShift via the Helm chart
    policy.open-cluster-management.io/categories: OCPOM - OpenShift Operator Management
    policy.open-cluster-management.io/standards: Kemo Labs 2026
    policy.open-cluster-management.io/controls: OLM-INST - Operator Instance
spec:
  disabled: false
  dependencies:
    - apiVersion: policy.open-cluster-management.io/v1
      kind: Policy
      name: operators-community-eso
      namespace: ""
      compliance: Compliant
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: gitlab-keycloak-secrets
        spec:
          remediationAction: enforce
          severity: high
          pruneObjectBehavior: DeleteIfCreated
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: external-secrets.io/v1beta1
                kind: ExternalSecret
                metadata:
                  name: vault-gitlab-keycloak
                  namespace: gitlab-system
                spec:
                  refreshInterval: "3600s"
                  secretStoreRef:
                    name: kemo-labs-vault
                    kind: ClusterSecretStore
                  target:
                    name: gitlab-keycloak
                    creationPolicy: Owner
                    deletionPolicy: Retain
                    template:
                      engineVersion: v2
                      type: Opaque
                      data:
                        provider: |
                          name: 'openid_connect'
                          label: 'Keycloak'
                          icon: ''
                          args:
                            name: 'openid_connect'
                            scope:
                              - openid
                              - profile
                              - email
                              - roles
                              - basic
                            response_type: 'code'
                            issuer: https://{{ (index (lookup "networking.k8s.io/v1" "Ingress" "rhbk" "openshell-ingress").spec.rules 0).host }}/realms/openshell
                            discovery: true
                            client_auth_method: 'jwt_bearer'
                            uid_field: 'preferred_username'
                            send_scope_to_token_endpoint: false
                            pkce: false
                            client_options:
                              identifier: 'gitlab'
                              secret: {{ `{{ .clientSecret }}` }}
                              redirect_uri: 'https://gitlab.{{ (fromClusterClaim "consoleurl.cluster.open-cluster-management.io") | replace "https://console-openshift-console.apps" "" }}/users/auth/openid_connect/callback'
                  data:
                    - secretKey: clientSecret
                      remoteRef:
                        key: kemo.labs/oauth/keycloak/openshell
                        property: gitlabClientSecret