---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: gitlab-chart-db
  annotations:
    policy.open-cluster-management.io/description: Deploys PostgreSQL objects needed to run GitLab on OpenShift via the Helm chart
    policy.open-cluster-management.io/categories: OCPOM - OpenShift Operator Management
    policy.open-cluster-management.io/standards: Kemo Labs 2026
    policy.open-cluster-management.io/controls: OLM-INST - Operator Instance
spec:
  disabled: false
  dependencies:
    - apiVersion: policy.open-cluster-management.io/v1
      kind: Policy
      name: health-check-odf
      namespace: ""
      compliance: Compliant
  policy-templates:
    - extraDependencies:
        - apiVersion: policy.open-cluster-management.io/v1
          kind: Policy
          name: operators-cnpgsql
          namespace: ""
          compliance: Compliant
      objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: gitlab-pgsql-instance
        spec:
          remediationAction: enforce
          severity: high
          pruneObjectBehavior: DeleteIfCreated
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: postgresql.cnpg.io/v1
                kind: Cluster
                metadata:
                  name: gitlab-db
                  namespace: gitlab-system
                spec:
                  instances: 1
                  enablePDB: false
                  enableSuperuserAccess: true
                  logLevel: info
                  primaryUpdateStrategy: unsupervised
                  storage:
                    size: 15Gi
                  walStorage:
                    size: 1Gi
            - complianceType: musthave
              objectDefinition:
                apiVersion: networking.k8s.io/v1
                kind: NetworkPolicy
                metadata:
                  name: allow-cnpg-operator
                  namespace: gitlab-system
                spec:
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/managed-by: cloudnative-pg # or for all CNPG Clusters
                      # cnpg.io/cluster: gitlab-db # The label value must be the cluster name
                  ingress:
                    - from:
                        - namespaceSelector:
                            matchLabels:
                              kubernetes.io/metadata.name: openshift-certified-operators # Namespace where the operator is deployed
                          podSelector:
                            matchLabels:
                              app.kubernetes.io/name: cloudnative-pg # Matches the Operator pod
                      ports:
                        - port: 8000
                        - port: 5432