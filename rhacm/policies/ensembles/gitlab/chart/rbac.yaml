---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: gitlab-chart-rbac
  annotations:
    policy.open-cluster-management.io/description: Deploys RBAC objects needed to run GitLab on OpenShift via the Helm chart
    policy.open-cluster-management.io/categories: OCPOM - OpenShift Operator Management
    policy.open-cluster-management.io/standards: Kemo Labs 2026
    policy.open-cluster-management.io/controls: OLM-INST - Operator Instance
spec:
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: gitlab-rbac
        spec:
          remediationAction: enforce
          severity: high
          pruneObjectBehavior: DeleteIfCreated
          object-templates:
            - complianceType: musthave
              objectDefinition:
                kind: ClusterRoleBinding
                apiVersion: rbac.authorization.k8s.io/v1
                metadata:
                  name: gitlab-default-nonroot
                subjects:
                  - kind: ServiceAccount
                    name: default
                    namespace: gitlab-system
                roleRef:
                  apiGroup: rbac.authorization.k8s.io
                  kind: ClusterRole
                  name: 'system:openshift:scc:nonroot-v2'
            - complianceType: musthave
              objectDefinition:
                kind: ClusterRoleBinding
                apiVersion: rbac.authorization.k8s.io/v1
                metadata:
                  name: gitlab-default-nonroot
                subjects:
                  - kind: ServiceAccount
                    name: gitlab-shared-secrets
                    namespace: gitlab-system
                roleRef:
                  apiGroup: rbac.authorization.k8s.io
                  kind: ClusterRole
                  name: 'system:openshift:scc:nonroot-v2'