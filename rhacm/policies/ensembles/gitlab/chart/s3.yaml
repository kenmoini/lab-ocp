---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: gitlab-chart-s3
  annotations:
    policy.open-cluster-management.io/description: Deploys ODF S3 objects needed to run GitLab on OpenShift via the Helm chart
    policy.open-cluster-management.io/categories: OCPOM - OpenShift Operator Management
    policy.open-cluster-management.io/standards: Kemo Labs 2025
    policy.open-cluster-management.io/controls: OLM-INST - Operator Instance
spec:
  disabled: false
  dependencies:
    - apiVersion: policy.open-cluster-management.io/v1
      kind: Policy
      name: health-check-odf
      namespace: ""
      compliance: Compliant
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: gitlab-s3-buckets
        spec:
          remediationAction: enforce
          severity: high
          pruneObjectBehavior: DeleteIfCreated
          object-templates-raw: |
            {{- range $key := (list "general" "pages" "registry" "uploads" "artifacts" "packages" "backups" "lfs" "toolbox" "secure-ci" "agent-plan" "ci-catalog" "dep-proxy" "ext-diffs") }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: objectbucket.io/v1alpha1
                kind: ObjectBucketClaim
                metadata:
                  name: gitlab-s3-{{ $key }}
                  namespace: gitlab-system
                spec:
                  additionalConfig:
                    bucketclass: noobaa-default-bucket-class
                  bucketName: gitlab-s3-{{ $key }}
                  objectBucketName: obc-openshift-storage-gitlab-{{ $key }}
                  storageClassName: openshift-storage.noobaa.io
            {{- end }}