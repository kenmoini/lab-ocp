---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: ursula-kafka-instance
  annotations:
    policy.open-cluster-management.io/description: Deploys Kafka resources needed to run Ursula on OpenShift
    policy.open-cluster-management.io/categories: OCPOM - OpenShift Operator Management
    policy.open-cluster-management.io/standards: Kemo Labs 2026
    policy.open-cluster-management.io/controls: OLM-INST - Operator Instance
spec:
  disabled: false
  dependencies:
    - apiVersion: policy.open-cluster-management.io/v1
      kind: Policy
      name: ursula-obc
      namespace: ""
      compliance: Compliant
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: ursula-kafka-instance
        spec:
          remediationAction: enforce
          severity: high
          pruneObjectBehavior: DeleteIfCreated
          object-templates:
            - complianceType: musthave
              objectDefinition:
                kind: Kafka
                apiVersion: kafka.strimzi.io/v1beta2
                metadata:
                  name: ursula-odf
                  namespace: openshift-storage
                  annotations:
                    strimzi.io/internal-cluster-security: |
                            {
                              "encryption": {
                                "type": "none"
                              },
                              "authentication": {
                                "type": "none"
                              }
                            }
                spec:
                  kafka:
                    version: 4.2.0
                    metadataVersion: 4.2-IV1
                    # replicas: 3
                    # authorization:
                    #   type: simple
                    #  superUsers:
                    #    - CN=my-user
                    #    - my-user
                    listeners:
                      - name: plain
                        port: 9092
                        type: internal
                        tls: false
                      - name: tls
                        port: 9093
                        type: internal
                        tls: true
                      - name: broker
                        port: 9094
                        type: route
                        tls: true
                    config:
                      offsets.topic.replication.factor: 3
                      transaction.state.log.replication.factor: 3
                      transaction.state.log.min.isr: 2
                      default.replication.factor: 3
                      min.insync.replicas: 2
                      # inter.broker.protocol.version: '4.2'
                  #   storage:
                  #     type: ephemeral
                  # zookeeper:
                  #   replicas: 3
                  #   storage:
                  #     type: ephemeral
                  entityOperator:
                    topicOperator: {}
                    userOperator: {}
                  # kafkaExporter:
                  #   topicRegex: ".*"
                  #   groupRegex: ".*"
            - complianceType: musthave
              objectDefinition:
                kind: KafkaNodePool
                apiVersion: kafka.strimzi.io/v1
                metadata:
                  name: ursula-odf
                  labels:
                    strimzi.io/cluster: ursula-odf
                  namespace: openshift-storage
                spec:
                  replicas: 3
                  roles:
                    - broker
                    - controller
                  storage:
                    type: jbod
                    volumes:
                      - id: 0
                        type: persistent-claim
                        size: 10Gi
                        deleteClaim: true
                        kraftMetadata: shared
            - complianceType: musthave
              objectDefinition:
                apiVersion: kafka.strimzi.io/v1
                kind: KafkaTopic
                metadata:
                  name: ursula-kafka-odf
                  labels:
                    strimzi.io/cluster: ursula-odf
                  namespace: openshift-storage
                spec:
                  partitions: 10
                  replicas: 3
                  config:
                    retention.ms: 604800000
                    segment.bytes: 1073741824

    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: ursula-kafka-dash
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                kind: Console
                apiVersion: console.streamshub.github.com/v1alpha1
                metadata:
                  name: kafka-console
                  namespace: openshift-storage
                spec:
                  hostname: kafka-console-openshift-storage.apps.tri-force.lab.kemo.network
                  kafkaClusters:
                    - name: ursula-odf
                      namespace: openshift-storage
                      listener: plain
