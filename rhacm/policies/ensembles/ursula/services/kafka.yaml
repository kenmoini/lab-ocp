    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: ursula-kafka-odf-patch
        spec:
          remediationAction: enforce
          severity: high
          pruneObjectBehavior: DeleteIfCreated
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: ursula-kafka-odf
                  namespace: openshift-storage
                type: Opaque
                stringData:
                  connect.json: |
                    {
                      "name": "ursula_kafka_odf_connection",
                      "notification_protocol": "kafka",
                      "metadata.broker.list": "ursula-odf-kafka-bootstrap.openshift-storage.svc.cluster.local:9092",
                      "topic": "ursula-kafka-odf"
                    }

    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: ursula-kafka-noobaa-patch
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: noobaa.io/v1alpha1
                kind: NooBaa
                metadata:
                  name: noobaa
                  namespace: openshift-storage
                spec:
                  bucketNotifications:
                    enabled: true
                    connections:
                      - name: ursula-kafka-odf
                        namespace: openshift-storage

