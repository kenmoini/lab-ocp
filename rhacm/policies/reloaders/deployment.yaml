apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: reloader-deployment
  annotations:
    policy.open-cluster-management.io/description: Reloads deployments when configmaps or secrets change
    policy.open-cluster-management.io/categories: OCPWM - OpenShift Workload Management
    policy.open-cluster-management.io/standards: Kemo Labs 2026
    policy.open-cluster-management.io/controls: OCP-FN - OpenShift Functions
spec:
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: reloader-deployment-cmap
        spec:
          remediationAction: enforce
          severity: low
          object-templates-raw: |
            {{/* ## Loop through the ConfigMaps with the reloader label ## */}}
            {{- $configMapList := (lookup "v1" "ConfigMap" "" "" "function.kemo.dev/reloader=enabled").items }}
            {{- range $configMap := $configMapList }}
            {{/* ## Check for the needed labels on the ConfigMap ## */}}
            {{- if and (hasKey $configMap.metadata.labels "reloader.kemo.dev/target") (hasKey $configMap.metadata.labels "reloader.kemo.dev/target-type") }}
            {{- $target := get $configMap.metadata.labels "reloader.kemo.dev/target" }}
            {{- $deployment := (lookup "apps/v1" "Deployment" $configMap.metadata.namespace $target) }}
            {{- if $deployment }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: apps/v1
                kind: Deployment
                metadata:
                  name: '{{ $target }}'
                  namespace: '{{ $configMap.metadata.namespace }}'
                  labels:
                    trigger.reloader.kemo.dev/{{ substr 0 35 $configMap.metadata.name }}: '{{ $configMap.metadata.resourceVersion }}'
                spec:
                  template:
                    metadata:
                      labels:
                        trigger.reloader.kemo.dev/{{ substr 0 35 $configMap.metadata.name }}: '{{ $configMap.metadata.resourceVersion }}'
            {{- end }}
            {{- end }}
            {{- end }}