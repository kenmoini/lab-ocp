    - extraDependencies:
        - apiVersion: policy.open-cluster-management.io/v1
          kind: ConfigurationPolicy
          # name: quay-instance-config-secret
          name: ext-secret-quay-check
          namespace: ""
          compliance: Compliant
      objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: quayregistry-instance
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                kind: QuayRegistry
                apiVersion: quay.redhat.com/v1
                metadata:
                  name: quay
                  namespace: quay
                spec:
                  configBundleSecret: quay-config
                  components:
                    - kind: clair
                      managed: true
                    - kind: postgres
                      managed: true
                    - kind: objectstorage
                      managed: false
                    - kind: redis
                      managed: true
                    - kind: horizontalpodautoscaler
                      managed: false
                    - kind: route
                      managed: true
                    - kind: mirror
                      managed: true
                      #overrides:
                      #  env:
                      #    - name: HTTP_PROXY
                      #      value: http://proxy.kemo.labs:3129
                      #    - name: HTTPS_PROXY
                      #      value: http://proxy.kemo.labs:3129
                      #    - name: NO_PROXY
                      #      value: '.local,.svc,localhost,127.0.0.1,10.0.0.0/8,172.16.0.0/23,192.168.0.0/16,.kemo.network,.kemo.labs'
                    - kind: monitoring
                      managed: true
                    - kind: tls
                      managed: true
                    - kind: quay
                      managed: true
                      #overrides:
                      #  env:
                      #    - name: HTTP_PROXY
                      #      value: http://proxy.kemo.labs:3129
                      #    - name: HTTPS_PROXY
                      #      value: http://proxy.kemo.labs:3129
                      #    - name: NO_PROXY
                      #      value: '.local,.svc,localhost,127.0.0.1,10.0.0.0/8,172.16.0.0/23,192.168.0.0/16,.kemo.network,.kemo.labs'
                    - kind: clairpostgres
                      managed: true

    - extraDependencies:
        - apiVersion: policy.open-cluster-management.io/v1
          kind: ConfigurationPolicy
          name: eso-vault-clustersecretstore
          namespace: ""
          compliance: Compliant
      objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: ext-secret-quay
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: external-secrets.io/v1beta1
                kind: ExternalSecret
                metadata:
                  name: quay-config-secret
                  namespace: quay
                spec:
                  refreshInterval: "3600s"
                  secretStoreRef:
                    name: kemo-labs-vault
                    kind: ClusterSecretStore
                  target:
                    name: quay-config # name of the k8s Secret to make in this namespace
                    creationPolicy: Owner
                    deletionPolicy: Retain
                    template:
                      engineVersion: v2
                      type: Opaque # type of k8s Secret to make
                  data:
                    - secretKey: 'config.yaml' # name of the key in the k8s Secret to create
                      remoteRef:
                        key: dev.kemo/lab/tri-force/quay # name of the secret under the target Vault path
                        property: configSecretData # name of the key in that named Vault secret

    - extraDependencies:
        - apiVersion: policy.open-cluster-management.io/v1
          kind: ConfigurationPolicy
          name: ext-secret-quay
          namespace: ""
          compliance: Compliant
      objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: ext-secret-quay-check
        spec:
          remediationAction: inform
          severity: critical
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: quay-config
                  namespace: quay
                type: Opaque

    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: quayregistry-route-check
        spec:
          remediationAction: inform
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: route.openshift.io/v1
                kind: Route
                metadata:
                  namespace: quay
                  name: quay-quay
      extraDependencies:
        - apiVersion: policy.open-cluster-management.io/v1
          kind: ConfigurationPolicy
          name: quayregistry-instance
          namespace: ""
          compliance: Compliant

    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: quayregistry-consolelink
        spec:
          remediationAction: enforce
          severity: critical
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: console.openshift.io/v1
                kind: ConsoleLink
                metadata:
                  name: quayregistry-console-link
                spec:
                  applicationMenu:
                    imageURL: 'data:image/svg+xml;base64,'
                    section: Hub Applications
                  href: 'https://{{ (lookup "route.openshift.io/v1" "Route" "quay" "quay-quay").spec.host }}'
                  location: ApplicationMenu
                  text: Quay Container Registry
      extraDependencies:
        - apiVersion: policy.open-cluster-management.io/v1
          kind: ConfigurationPolicy
          name: quayregistry-route-check
          namespace: ""
          compliance: Compliant