---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: instance-truenas-csi
  annotations:
    policy.open-cluster-management.io/description: Configures the TrueNAS CSI Operator
    policy.open-cluster-management.io/categories: OCPOM - OpenShift Operator Management
    policy.open-cluster-management.io/standards: Kemo Labs 2026
    policy.open-cluster-management.io/controls: OLM-SUB - Operator Installation
spec:
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: truenas-api-key
        spec:
          remediationAction: enforce
          severity: high
          pruneObjectBehavior: None
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: external-secrets.io/v1beta1
                kind: ExternalSecret
                metadata:
                  name: truenas-api-key
                  namespace: truenas-csi
                spec:
                  refreshInterval: "3600s"
                  secretStoreRef:
                    name: kemo-labs-vault
                    kind: ClusterSecretStore
                  target:
                    name: deep-thought-api # name of the k8s Secret to make in this namespace
                    creationPolicy: Owner
                    deletionPolicy: Retain
                    template:
                      engineVersion: v2
                      type: Opaque # type of k8s Secret to make
                  data:
                    - secretKey: api-key
                      remoteRef:
                        key: 'kemo.labs/infrastructure/storage/deep-thought' # name of the secret under the target Vault path
                        property: apiKey # # name of the key in that named Vault secret

    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: truenas-csi-cr
        spec:
          remediationAction: inform
          severity: high
          pruneObjectBehavior: None
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: csi.truenas.io/v1alpha1
                kind: TrueNASCSI
                metadata:
                  name: truenas
                spec:
                  truenasURL: "wss://deep-thought.kemo.labs/api/current"
                  credentialsSecret: "deep-thought-api"
                  defaultPool: "nvmePool"
                  nfsServer: "deep-thought.kemo.labs"
                  # iscsiPortal: "192.168.42.48:3260"
                  iscsiIQNBase: "iqn.2005-10.org.freenas.ctl"
                  insecureSkipTLS: true
                  controllerReplicas: 1
                  namespace: truenas-csi
                  managementState: Managed
                  logLevel: 4
                  # nodeSelector:
                  #   node-role.kubernetes.io/worker: ""
                  # tolerations:
                  #   - key: "node.kubernetes.io/not-ready"
                  #     operator: "Exists"
                  #     effect: "NoExecute"
                  #     tolerationSeconds: 300

    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: truenas-csi-storageclass
        spec:
          remediationAction: enforce
          severity: high
          pruneObjectBehavior: None
          object-templates:
            - complianceType: musthave
              recreateOption: IfRequired
              objectDefinition:
                # NFS StorageClass — full parameter reference
                # Creates ReadWriteMany volumes backed by NFS shares on TrueNAS.
                #
                # Only "protocol" is required. Every other parameter below is optional; the value
                # shown is the default (commented) unless the line is uncommented. Parameters not
                # valid for NFS (e.g. iscsi.*, nvmeof.*, volblocksize, sparse) are ignored if set.
                apiVersion: storage.k8s.io/v1
                kind: StorageClass
                metadata:
                  name: truenas-nfs
                provisioner: csi.truenas.io
                reclaimPolicy: Delete
                volumeBindingMode: Immediate
                allowVolumeExpansion: true
                parameters:
                  protocol: "nfs"

                  # --- Common (all protocols) ---
                  # ZFS pool for volumes. Default: the driver's TRUENAS_DEFAULT_POOL.
                  pool: "nvmePool"
                  # Parent path for volume datasets, RELATIVE to the pool (no pool prefix, no
                  # leading/trailing "/", no ".."). WITHOUT this, volume datasets land at the POOL
                  # ROOT (pool/<pvc-name>); set it to keep CSI volumes grouped. With
                  # datasetPath: "k8s/nfs" a volume becomes pool/k8s/nfs/<pvc-name>.
                  datasetPath: "truenas-csi/{{hub .ManagedClusterName hub}}/nfs"
                  # ZFS compression: OFF, LZ4 (default), GZIP[-1|-9], ZSTD[-1..-9], ZLE, LZJB.
                  compression: "LZ4"
                  # ZFS sync mode: STANDARD (default), ALWAYS, DISABLED.
                  # sync: "STANDARD"

                  # --- NFS ---
                  # Extra client mount options (comma-separated).
                  # nfs.mountOptions: "hard,nfsvers=4.1"
                  # Restrict the export to specific hosts / networks (comma-separated).
                  # nfs.hosts: "10.0.0.10,10.0.0.11"
                  # nfs.networks: "10.0.0.0/8,192.168.1.0/24"
                  # User/group all access is squashed to (mapall). Defaults root / wheel.
                  # nfs.mapAllUser: "root"
                  # nfs.mapAllGroup: "wheel"
                  # Set false for no_root_squash so a pod fsGroup can own the volume root —
                  # required for ownership-sensitive non-root workloads (see
                  # storageclass-nfs-fsgroup.yaml). Default: true (mapall in force).
                  # nfs.rootSquash: "true"

                  # --- Encryption (optional; see storageclass-encrypted.yaml) ---
                  # encryption: "true"
                  # encryption.algorithm: "AES-256-GCM"
                  # encryption.passphrase: "<passphrase>"     # or use a key / generateKey
                  # encryption.generateKey: "true"

                  # --- Scheduled snapshots (optional; omit snapshot.schedule to disable) ---
                  # snapshot.schedule: "0 2 * * *"            # cron: minute hour dom month dow
                  # snapshot.naming: "auto-%Y-%m-%d_%H-%M"     # strftime; this is the default
                  # snapshot.retention: "2"                    # count of retentionUnit (default 2)
                  # snapshot.retentionUnit: "WEEK"             # HOUR, DAY, WEEK (default), MONTH, YEAR
                  # snapshot.recursive: "false"

                  # --- Delete behavior (optional) ---
                  # forceDelete: "false"
            - complianceType: musthave
              recreateOption: IfRequired
              objectDefinition:
                # iSCSI StorageClass — full parameter reference
                # Creates ReadWriteOnce block volumes backed by ZVOLs on TrueNAS.
                #
                # NOTE: iSCSI portals must be IPv4. On IPv6-only clusters use NFS — the pinned
                # csi-lib-iscsi mis-parses IPv6 portals.
                #
                # Only "protocol" is required. Every other parameter below is optional; the value
                # shown is the default (commented) unless the line is uncommented. Parameters not
                # valid for iSCSI (e.g. nfs.*, nvmeof.*) are ignored if set.
                apiVersion: storage.k8s.io/v1
                kind: StorageClass
                metadata:
                  name: truenas-iscsi
                provisioner: csi.truenas.io
                reclaimPolicy: Delete
                volumeBindingMode: Immediate
                allowVolumeExpansion: true
                parameters:
                  protocol: "iscsi"
                  # --- Common (all protocols) ---
                  # ZFS pool for volumes. Default: the driver's TRUENAS_DEFAULT_POOL.
                  pool: "nvmePool"
                  # Parent path for volume datasets, RELATIVE to the pool (no pool prefix, no
                  # leading/trailing "/", no ".."). WITHOUT this, volume datasets land at the POOL
                  # ROOT (pool/<pvc-name>); set it to keep CSI volumes grouped. With
                  # datasetPath: "k8s/iscsi" a volume becomes pool/k8s/iscsi/<pvc-name>.
                  datasetPath: "truenas-csi/{{hub .ManagedClusterName hub}}/iscsi"
                  # ZFS compression: OFF, LZ4 (default), GZIP[-1|-9], ZSTD[-1..-9], ZLE, LZJB.
                  compression: "LZ4"
                  fsType: xfs
                  # ZFS sync mode: STANDARD (default), ALWAYS, DISABLED.
                  # sync: "STANDARD"

                  # --- ZVOL (iSCSI and NVMe-oF) ---
                  # ZVOL block size: 512, 1K, 2K, 4K, 8K, 16K (default), 32K, 64K, 128K.
                  volblocksize: "16K"
                  # Thin-provision the ZVOL. Default: false (thick / space reserved).
                  sparse: "true"

                  # --- iSCSI ---
                  # iSCSI logical/physical block size: 512 (default), 1024, 2048, 4096.
                  iscsi.blocksize: "4096"
                  # Restrict the target to specific initiator IQNs (comma-separated). Default: all.
                  # iscsi.initiators: "iqn.2024-01.com.example:node1,iqn.2024-01.com.example:node2"
                  # The IQN base is auto-derived from the appliance's iscsi.global.basename; only
                  # override for unusual setups.
                  # iscsi.iqn-base: "iqn.2005-10.org.freenas.ctl"
                  # CHAP / mutual CHAP authentication: see storageclass-iscsi-chap.yaml.
                  # Node-side session behavior:
                  # iscsi.multipathEnabled: "false"
                  # iscsi.persistentSessions: "false"

                  # --- Encryption (optional; see storageclass-encrypted.yaml) ---
                  # encryption: "true"
                  # encryption.algorithm: "AES-256-GCM"
                  # encryption.passphrase: "<passphrase>"     # or use a key / generateKey
                  # encryption.generateKey: "true"

                  # --- Scheduled snapshots (optional; omit snapshot.schedule to disable) ---
                  # snapshot.schedule: "0 2 * * *"            # cron: minute hour dom month dow
                  # snapshot.naming: "auto-%Y-%m-%d_%H-%M"     # strftime; this is the default
                  # snapshot.retention: "2"                    # count of retentionUnit (default 2)
                  # snapshot.retentionUnit: "WEEK"             # HOUR, DAY, WEEK (default), MONTH, YEAR
                  # snapshot.recursive: "false"

                  # --- Delete behavior (optional) ---
                  # forceDelete: "false"
                  # deleteExtentsWithTarget: "true"