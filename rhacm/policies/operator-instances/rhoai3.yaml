---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: instance-rhoai3
  annotations:
    policy.open-cluster-management.io/description: Deploys the Red Hat OpenShift AI Operator Instance
    policy.open-cluster-management.io/categories: OCPOM - OpenShift Operator Management
    policy.open-cluster-management.io/standards: Kemo Labs 2025
    policy.open-cluster-management.io/controls: OLM-INST - Operator Instance
spec:
  disabled: false
  policy-templates:
    # Create a MCSB to allow for the targeted placement that copies the DB secret
    - extraDependencies:
        - apiVersion: policy.open-cluster-management.io/v1
          kind: Policy
          name: operators-rhoai
          namespace: ""
          compliance: Compliant
      ignorePending: true
      objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: mcsb-global-rhoads
        spec:
          remediationAction: enforce
          severity: low
          pruneObjectBehavior: None
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: cluster.open-cluster-management.io/v1beta2
                kind: ManagedClusterSetBinding
                metadata:
                  name: global
                  namespace: redhat-ods-applications
                spec:
                  clusterSet: global
            - complianceType: musthave
              objectDefinition:
                apiVersion: cluster.open-cluster-management.io/v1beta2
                kind: ManagedClusterSetBinding
                metadata:
                  name: global
                  namespace: redhat-ods-monitoring
                spec:
                  clusterSet: global

    # Create the Kuadrant namespace and operator instance
    - extraDependencies:
        - apiVersion: policy.open-cluster-management.io/v1
          kind: Policy
          name: operators-rhoai
          namespace: ""
          compliance: Compliant
        - apiVersion: policy.open-cluster-management.io/v1
          kind: Policy
          name: operators-rhcl
          namespace: ""
          compliance: Compliant
      objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: rhoai-kuadrant
        spec:
          remediationAction: enforce
          severity: high
          pruneObjectBehavior: DeleteIfCreated
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: kuadrant-system
            - complianceType: musthave
              objectDefinition:
                apiVersion: kuadrant.io/v1beta1
                kind: Kuadrant
                metadata:
                  name: kuadrant
                  namespace: kuadrant-system
                spec:
                  observability:
                    enable: true

    # Check for the Authorino service so we can annotate it
    - extraDependencies:
        - apiVersion: policy.open-cluster-management.io/v1
          kind: ConfigurationPolicy
          name: rhoai-kuadrant
          namespace: ""
          compliance: Compliant
        - apiVersion: policy.open-cluster-management.io/v1
          kind: Policy
          name: operators-authorino
          namespace: ""
          compliance: Compliant
      objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: rhoai-auth-svc-check
        spec:
          remediationAction: inform
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Service
                metadata:
                  name: authorino-authorino-authorization
                  namespace: kuadrant-system

    # Enforce the Authorino service annotations for TLS cert generation
    - extraDependencies:
        - apiVersion: policy.open-cluster-management.io/v1
          kind: ConfigurationPolicy
          name: rhoai-auth-svc-check
          namespace: ""
          compliance: Compliant
      objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: rhoai-auth-svc-meta
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Service
                metadata:
                  name: authorino-authorino-authorization
                  namespace: kuadrant-system
                  annotations:
                    service.beta.openshift.io/serving-cert-secret-name: authorino-server-cert

    # Create the Authorino instance
    - extraDependencies:
        - apiVersion: policy.open-cluster-management.io/v1
          kind: ConfigurationPolicy
          name: rhoai-auth-svc-meta
          namespace: ""
          compliance: Compliant
        - apiVersion: policy.open-cluster-management.io/v1
          kind: Policy
          name: operators-authorino
          namespace: ""
          compliance: Compliant
      objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: rhoai-authorino
        spec:
          remediationAction: enforce
          severity: high
          pruneObjectBehavior: DeleteIfCreated
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: operator.authorino.kuadrant.io/v1beta1
                kind: Authorino
                metadata:
                  name: authorino
                  namespace: kuadrant-system
                spec:
                  replicas: 1
                  clusterWide: true
                  listener:
                    tls:
                      enabled: true
                      certSecretRef:
                        name: authorino-server-cert
                  oidcServer:
                    tls:
                      enabled: false

    - extraDependencies:
        - apiVersion: policy.open-cluster-management.io/v1
          kind: ConfigurationPolicy
          name: rhoai-authorino
          namespace: ""
          compliance: Compliant
      objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: authorino-kuadrant-status
        spec:
          remediationAction: inform
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: apps/v1
                kind: Deployment
                metadata:
                  name: authorino
                  namespace: kuadrant-system
                status:
                  conditions:
                    - status: 'True'
                      type: Available

    - extraDependencies:
        - apiVersion: policy.open-cluster-management.io/v1
          kind: ConfigurationPolicy
          name: rhoai-authorino
          namespace: ""
          compliance: Compliant
        - apiVersion: policy.open-cluster-management.io/v1
          kind: ConfigurationPolicy
          name: authorino-kuadrant-status
          namespace: ""
          compliance: Compliant
      objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: rhoai-authorino-envs
        spec:
          remediationAction: enforce
          severity: high
          pruneObjectBehavior: DeleteIfCreated
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: apps/v1
                kind: Deployment
                metadata:
                  name: authorino
                  namespace: kuadrant-system
                spec:
                  template:
                    spec:
                      containers:
                        - name: authorino
                          env:
                            - name: SSL_CERT_FILE
                              value: /etc/ssl/certs/openshift-service-ca/service-ca-bundle.crt
                            - name: REQUESTS_CA_BUNDLE
                              value: /etc/ssl/certs/openshift-service-ca/service-ca-bundle.crt

    - extraDependencies:
        - apiVersion: policy.open-cluster-management.io/v1
          kind: Policy
          name: operators-rhoai
          namespace: ""
          compliance: Compliant
        - apiVersion: policy.open-cluster-management.io/v1
          kind: ConfigurationPolicy
          name: default-gatewayclass
          namespace: ""
          compliance: Compliant
      objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: rhoai-gateway
        spec:
          remediationAction: enforce
          severity: high
          pruneObjectBehavior: DeleteIfCreated
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: maas-default-gateway-config
                  namespace: openshift-ingress
                data:
                  deployment: |
                    metadata:
                      labels:
                        istio-prometheus-ignore: ""
                    spec:
                      template:
                        metadata:
                          labels:
                            istio-prometheus-ignore: ""
                        spec:
                          containers:
                          - name: istio-proxy
                            resources:
                              requests:
                                cpu: 100m
                                memory: 256Mi
                              limits:
                                cpu: "2"
                                memory: 2Gi
                  service: |
                    spec:
                      type: ClusterIP
            - complianceType: musthave
              objectDefinition:
                apiVersion: route.openshift.io/v1
                kind: Route
                metadata:
                  name: maas-default-gateway
                  namespace: openshift-ingress
                spec:
                  host: '{{ (fromClusterClaim "consoleurl.cluster.open-cluster-management.io") | replace "https://console-openshift-console" "maas" }}'
                  port:
                    targetPort: http
                  tls:
                    insecureEdgeTerminationPolicy: Allow
                    termination: edge
                  to:
                    kind: Service
                    name: maas-default-gateway-openshift-default
                    weight: 100
                  wildcardPolicy: None
            - complianceType: musthave
              objectDefinition:
                apiVersion: gateway.networking.k8s.io/v1
                kind: Gateway
                metadata:
                  name: maas-default-gateway
                  namespace: openshift-ingress
                  labels:
                    istio.io/rev: openshift-gateway
                    opendatahub.io/managed: "false"
                  annotations:
                    opendatahub.io/managed: "false"
                    security.opendatahub.io/authorino-tls-bootstrap: "true"
                spec:
                  gatewayClassName: openshift-default
                  infrastructure:
                    parametersRef:
                      group: ""
                      kind: ConfigMap
                      name: maas-default-gateway-config
                  listeners:
                    - name: http
                      port: 80
                      protocol: HTTP
                      hostname: '{{ (fromClusterClaim "consoleurl.cluster.open-cluster-management.io") | replace "https://console-openshift-console" "maas" }}'
                      allowedRoutes:
                        namespaces:
                          from: All
                    - name: https
                      hostname: '{{ (fromClusterClaim "consoleurl.cluster.open-cluster-management.io") | replace "https://console-openshift-console" "maas" }}'
                      port: 443
                      protocol: HTTPS
                      allowedRoutes:
                        namespaces:
                          from: All
                      tls:
                        certificateRefs:
                        - group: ""
                          kind: Secret
                          name: ingress-lb-tls
                        mode: Terminate

    # Check for the Tenant instance so we can configure it
    - extraDependencies:
        - apiVersion: policy.open-cluster-management.io/v1
          kind: ConfigurationPolicy
          name: rhoai-gateway
          namespace: ""
          compliance: Compliant
      objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: rhoai-tenant-check
        spec:
          remediationAction: inform
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: maas.opendatahub.io/v1alpha1
                kind: MaasTenantConfig
                metadata:
                  name: default-tenant
                  namespace: models-as-a-service

    # Create a Pipelines DB and OBC
    - extraDependencies:
        - apiVersion: policy.open-cluster-management.io/v1
          kind: ConfigurationPolicy
          name: rhoai-tenant-check
          namespace: ""
          compliance: Compliant
      objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: rhoai-maas-pipeline-init
        spec:
          remediationAction: enforce
          severity: high
          pruneObjectBehavior: DeleteIfCreated
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: objectbucket.io/v1alpha1
                kind: ObjectBucketClaim
                metadata:
                  name: pipeline
                  namespace: models-as-a-service
                spec:
                  bucketName: maas-pipeline
                  additionalConfig:
                    bucketclass: "noobaa-default-bucket-class"
                  storageClassName: "openshift-storage.noobaa.io"
                  objectBucketName: obc-models-as-a-service-pipeline
    - extraDependencies:
        - apiVersion: policy.open-cluster-management.io/v1
          kind: ConfigurationPolicy
          name: rhoai-tenant-check
          namespace: ""
          compliance: Compliant
      objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: rhoai-maas-pipeline-db
        spec:
          remediationAction: enforce
          severity: high
          pruneObjectBehavior: DeleteIfCreated
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: k8s.mariadb.com/v1alpha1
                kind: MariaDB
                metadata:
                  name: mlpipeline
                  namespace: models-as-a-service
                spec:
                  rootPasswordSecretKeyRef:
                    name: mariadb
                    key: password
                    generate: true
                  username: mariadb
                  passwordSecretKeyRef:
                    name: mlpipeline-db-creds
                    key: password
                    generate: true
                  database: mariadb
                  port: 3306
                  storage:
                    size: 2Gi
                    # storageClassName: csi-hostpath-sc
                    # volumeClaimTemplate:
                    #   volumeAttributesClassName: high-performance
                  service:
                    type: ClusterIP
                    # metadata:
                    #   annotations:
                    #     metallb.io/loadBalancerIPs: 172.18.0.20
                  myCnf: |
                    [mariadb]
                    bind-address=*
                    default_storage_engine=InnoDB
                    binlog_format=row
                    innodb_autoinc_lock_mode=2
                    innodb_buffer_pool_size=1600M
                    max_allowed_packet=256M
                  resources:
                    requests:
                      cpu: 300m
                      memory: 128Mi
                    limits:
                      memory: 2Gi
                  metrics:
                    enabled: true
                  tls:
                    enabled: true
                    # Enforce TLS in all connections.
                    # required: true
                    # Issue certificates with an existing cert-manager ClusterIssuer.
                    # serverCertIssuerRef:
                    #   name: root-ca
                    #   kind: ClusterIssuer
                    # clientCertIssuerRef:
                    #   name: root-ca
                    #   kind: ClusterIssuer
                    # Bring your own Certificate Authority.
                    # serverCASecretRef:
                    #   name: mariadb-server-ca
                    # clientCASecretRef:
                    #   name: mariadb-client-ca
                    # Configure existing certificates available in a Secret.
                    # serverCASecretRef:
                    #   name: mariadb-server-ca
                    # serverCertSecretRef:
                    #   name: mariadb-server-tls
                    # clientCASecretRef:
                    #   name: mariadb-client-ca
                    # clientCertSecretRef:
                    #   name: mariadb-client-tls
            - complianceType: musthave
              objectDefinition:
                apiVersion: k8s.mariadb.com/v1alpha1
                kind: Database
                metadata:
                  name: mlpipeline
                  namespace: models-as-a-service
                spec:
                  # If you want the database to be created with a different name than the resource name
                  # name: my-logical-database
                  mariaDbRef:
                    name: mlpipeline
                  characterSet: utf8
                  collate: utf8_general_ci
                  # Delete the resource in the database whenever the CR gets deleted.
                  # Alternatively, you can specify Skip in order to omit deletion.
                  cleanupPolicy: Delete
                  requeueInterval: 10h
                  retryInterval: 30s
            - complianceType: musthave
              objectDefinition:
                apiVersion: k8s.mariadb.com/v1alpha1
                kind: User
                metadata:
                  name: mlpipeline
                spec:
                  # If you want the user to be created with a different name than the resource name
                  # name: user-custom
                  mariaDbRef:
                    name: mlpipeline
                  passwordSecretKeyRef:
                    name: mlpipeline-db
                    key: password
                    generate: true
                  # This field defaults to 10
                  maxUserConnections: 20
                  host: "%"
                  # Delete the resource in the database whenever the CR gets deleted.
                  # Alternatively, you can specify Skip in order to omit deletion.
                  cleanupPolicy: Delete
                  # Require TLS when connecting with this user.
                  # See: https://mariadb.com/kb/en/securing-connections-for-client-and-server/#requiring-tls
                  # require:
                  #   issuer: "/CN=mariadb-ca"
                  #   subject: "/CN=mariadb-client"
                  requeueInterval: 10h
                  retryInterval: 30s
            - complianceType: musthave
              objectDefinition:
                apiVersion: k8s.mariadb.com/v1alpha1
                kind: Grant
                metadata:
                  name: mlpipeline-grant
                spec:
                  mariaDbRef:
                    name: mlpipeline
                  privileges:
                    - "ALL PRIVILEGES"
                  database: "mlpipeline"
                  table: "*"
                  username: mlpipeline
                  grantOption: true
                  host: "%"
                  # Delete the resource in the database whenever the CR gets deleted.
                  # Alternatively, you can specify Skip in order to omit deletion.
                  cleanupPolicy: Delete
                  requeueInterval: 10h
                  retryInterval: 30s

    - extraDependencies:
        - apiVersion: policy.open-cluster-management.io/v1
          kind: ConfigurationPolicy
          name: rhoai-maas-pipeline-init
          namespace: ""
          compliance: Compliant
      objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: rhoai-maas-dspa
        spec:
          remediationAction: enforce
          severity: high
          pruneObjectBehavior: DeleteIfCreated
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: datasciencepipelinesapplications.opendatahub.io/v1
                kind: DataSciencePipelinesApplication
                metadata:
                  name: dspa
                  namespace: models-as-a-service
                spec:
                  apiServer:
                    caBundleFileMountPath: ''
                    caBundleFileName: ''
                    deploy: true
                    artifactSignedURLExpirySeconds: 60
                    enableSamplePipeline: false
                    managedPipelines: {}
                    enableOauth: true
                    cacheEnabled: true
                    pipelineStore: kubernetes
                  database:
                    disableHealthCheck: false
                    # externalDB:
                    #   host: 
                    mariaDB:
                      deploy: true
                      pipelineDBName: mlpipeline
                      pvcSize: 10Gi
                      username: mlpipeline
                  dspVersion: v2
                  objectStorage:
                    disableHealthCheck: false
                    enableExternalRoute: false
                    externalStorage:
                      basePath: ''
                      bucket: maas-pipeline
                      host: s3.openshift-storage.svc.cluster.local
                      port: ''
                      region: us-east-1
                      s3CredentialsSecret:
                        accessKey: AWS_ACCESS_KEY_ID
                        secretKey: AWS_SECRET_ACCESS_KEY
                        secretName: pipeline
                      scheme: https
                  persistenceAgent:
                    deploy: true
                    numWorkers: 2
                  podToPodTLS: true
                  scheduledWorkflow:
                    cronScheduleTimezone: UTC
                    deploy: true

    # Configure the Tenant instance for Telemetry
    - extraDependencies:
        - apiVersion: policy.open-cluster-management.io/v1
          kind: ConfigurationPolicy
          name: rhoai-tenant-check
          namespace: ""
          compliance: Compliant
      objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: rhoai-tenant-telemetry
        spec:
          remediationAction: enforce
          severity: high
          pruneObjectBehavior: DeleteIfCreated
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: maas.opendatahub.io/v1alpha1
                kind: MaasTenantConfig
                metadata:
                  name: default-tenant
                  namespace: models-as-a-service
                spec:
                  telemetry:
                    enabled: true
                    metrics:
                      captureModelUsage: true
                      captureOrganization: true
                      captureUser: true
                      captureGroup: false

    # Check for the DSCI instance so we can configure it
    - extraDependencies:
        - apiVersion: policy.open-cluster-management.io/v1
          kind: Policy
          name: operators-rhoai
          namespace: ""
          compliance: Compliant
      objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: rhoai-dsci-check
        spec:
          remediationAction: inform
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: dscinitialization.opendatahub.io/v2
                kind: DSCInitialization
                metadata:
                  name: default-dsci

    # Configure the DSCI instance for observability
    - extraDependencies:
        - apiVersion: policy.open-cluster-management.io/v1
          kind: ConfigurationPolicy
          name: rhoai-dsci-check
          namespace: ""
          compliance: Compliant
      objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: rhoai-dsci-o11y
        spec:
          remediationAction: enforce
          severity: high
          pruneObjectBehavior: DeleteIfCreated
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: dscinitialization.opendatahub.io/v2
                kind: DSCInitialization
                metadata:
                  name: default-dsci
                spec:
                  monitoring:
                    managementState: Managed                 # Required: Enables and manages the observability stack
                    namespace: redhat-ods-monitoring    # Required: Namespace where monitoring components are deployed
                    collectorReplicas: 1                        # Optional: Number of collector instances for high availability
                    alerting: {}                              # Alertmanager configuration, uses default settings if empty
                    metrics:                                  # Prometheus configuration for metrics collection
                      replicas: 1                             # Optional: Number of Prometheus instances
                      # resources:                              # CPU and memory requests and limits for Prometheus pods
                      #   cpulimit: 500m                        # Optional: Maximum CPU allocation in millicores
                      #   cpurequest: 100m                      # Optional: Minimum CPU allocation in millicores
                      #   memorylimit: 512Mi                    # Optional: Maximum memory allocation in mebibytes
                      #   memoryrequest: 256Mi                  # Optional: Minimum memory allocation in mebibytes
                      storage:                                # Storage configuration for metrics data
                        size: 5Gi                             # Required: Storage size for Prometheus data
                        retention: 10d                        # Required: Retention period for metrics data in days
                      # exporters: {}                           # External metrics exporters
                    traces:                                   # Tempo backend for distributed tracing
                      sampleRatio: '0.1'                      # Optional: Portion of traces to sample, expressed as a decimal
                      storage:                                # Storage configuration for trace data
                        backend: pv                           # Required: Storage backend for Tempo traces (pv, s3, or gcs)
                        retention: 2160h                      # Optional: Retention period for trace data in hours
                      # exporters: {}                           # External traces exporters
                      tls:
                        enabled: true

    - extraDependencies:
        - apiVersion: policy.open-cluster-management.io/v1
          kind: ConfigurationPolicy
          name: rhoai-dsci-check
          namespace: ""
          compliance: Compliant
        - apiVersion: policy.open-cluster-management.io/v1
          kind: ConfigurationPolicy
          name: rhoai-dsci-o11y
          namespace: ""
          compliance: Compliant
      objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: rhoai-o11y-rbac
        spec:
          remediationAction: enforce
          severity: high
          pruneObjectBehavior: DeleteIfCreated
          object-templates:
            - complianceType: musthave
              objectDefinition:
                kind: ClusterRole
                apiVersion: rbac.authorization.k8s.io/v1
                metadata:
                  name: rhods-otel-metrics-reader
                rules:
                  - verbs:
                      - get
                    nonResourceURLs:
                      - /metrics
                      - /api
                      - /api/*
                      - /apis
                      - /apis/*
                  - verbs:
                      - get
                      - list
                      - watch
                    apiGroups:
                      - ''
                    resources:
                      - nodes/metrics
                      - nodes
                      - configmaps
                  - verbs:
                      - get
                    apiGroups:
                      - monitoring.coreos.com
                    resources:
                      - servicemonitors
                      - podmonitors
                  - verbs:
                      - get
                      - list
                      - watch
                    apiGroups:
                      - "networking.k8s.io"
                    resources:
                      - ingresses
            - complianceType: musthave
              objectDefinition:
                kind: ClusterRoleBinding
                apiVersion: rbac.authorization.k8s.io/v1
                metadata:
                  name: rhods-otel-metrics-reader
                subjects:
                  - kind: ServiceAccount
                    name: data-science-collector-collector
                    namespace: redhat-ods-monitoring
                roleRef:
                  apiGroup: rbac.authorization.k8s.io
                  kind: ClusterRole
                  name: rhods-otel-metrics-reader

    - extraDependencies:
        - apiVersion: policy.open-cluster-management.io/v1
          kind: Policy
          name: operators-cnpgsql
          namespace: ""
          compliance: Compliant
      objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: maas-pgsql-instance
        spec:
          remediationAction: enforce
          severity: high
          pruneObjectBehavior: DeleteIfCreated
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: networking.k8s.io/v1
                kind: NetworkPolicy
                metadata:
                  name: allow-cnpg-operator
                  namespace: redhat-ods-applications
                spec:
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/managed-by: cloudnative-pg # or for all CNPG Clusters
                      # cnpg.io/cluster: maas-db # The label value must be the cluster name
                  ingress:
                    - from:
                        - namespaceSelector:
                            matchLabels:
                              kubernetes.io/metadata.name: openshift-certified-operators # Namespace where the operator is deployed
                          podSelector:
                            matchLabels:
                              app.kubernetes.io/name: cloudnative-pg # Matches the Operator pod
                      ports:
                        - port: 8000
                        - port: 5432
            - complianceType: musthave
              objectDefinition:
                kind: Cluster
                apiVersion: postgresql.cnpg.io/v1
                metadata:
                  name: maas-db
                  namespace: redhat-ods-applications
                spec:
                  instances: 1
                  enablePDB: false
                  enableSuperuserAccess: true
                  logLevel: info
                  primaryUpdateStrategy: unsupervised
                  storage:
                    size: 1Gi
                  walStorage:
                    size: 1Gi

    - extraDependencies:
        - apiVersion: policy.open-cluster-management.io/v1
          kind: Policy
          name: operators-rhoai
          namespace: ""
          compliance: Compliant
        - apiVersion: policy.open-cluster-management.io/v1
          kind: ConfigurationPolicy
          name: maas-pgsql-instance
          namespace: ""
          compliance: Compliant
        - apiVersion: policy.open-cluster-management.io/v1
          kind: Policy
          name: operators-authorino
          namespace: ""
          compliance: Compliant
        - apiVersion: policy.open-cluster-management.io/v1
          kind: Policy
          name: operators-limitador
          namespace: ""
          compliance: Compliant
        - apiVersion: policy.open-cluster-management.io/v1
          kind: Policy
          name: operators-rhcl
          namespace: ""
          compliance: Compliant
        - apiVersion: policy.open-cluster-management.io/v1
          kind: Policy
          name: operators-rh-dns
          namespace: ""
          compliance: Compliant
      objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: rhoai-instance
        spec:
          remediationAction: enforce
          severity: high
          pruneObjectBehavior: DeleteIfCreated
          object-templates:
            - complianceType: musthave
              objectDefinition:
                kind: DataScienceCluster
                apiVersion: datasciencecluster.opendatahub.io/v2
                metadata:
                  name: default-dsc
                  labels:
                    app.kubernetes.io/name: datasciencecluster
                spec:
                  components:
                    ogx:
                      managementState: Managed
                    aigateway:
                      batchGateway:
                        managementState: Managed
                      managementState: Managed
                      modelsAsAService:
                        managementState: Managed
                    dashboard:
                      managementState: Managed
                    aipipelines:
                      managementState: Managed
                    feastoperator:
                      managementState: Managed
                    mcplifecycleoperator:
                      managementState: Managed
                    kserve:
                      managementState: Managed
                      rawDeploymentServiceConfig: Headed
                      # Replaced by aigateway
                      #modelsAsService:
                      #  managementState: Managed
                    # llamastackoperator has been replaced by OGX 
                    #llamastackoperator:
                    #  managementState: Managed
                    kueue:
                      #managementState: Unmanaged
                      defaultClusterQueueName: default
                      defaultLocalQueueName: default
                    mlflowoperator:
                      managementState: Managed
                    sparkoperator:
                      managementState: Managed
                    modelregistry:
                      managementState: Managed
                      registriesNamespace: rhoai-model-registries
                    ray:
                      managementState: Managed
                    workbenches:
                      managementState: Managed
                      workbenchNamespace: rhods-notebooks
                    trainer:
                      managementState: Managed
                    trainingoperator:
                      managementState: Managed
                    trustyai:
                      managementState: Managed

    - extraDependencies:
        - apiVersion: policy.open-cluster-management.io/v1
          kind: ConfigurationPolicy
          name: rhoai-operator-status
          namespace: ""
          compliance: Compliant
        - apiVersion: policy.open-cluster-management.io/v1
          kind: ConfigurationPolicy
          name: rhoai-instance
          namespace: ""
          compliance: Compliant
      objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: rhoai-odhdash-check
        spec:
          remediationAction: inform
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: opendatahub.io/v1alpha
                kind: OdhDashboardConfig
                metadata:
                  name: odh-dashboard-config
                  namespace: redhat-ods-applications

    - extraDependencies:
        - apiVersion: policy.open-cluster-management.io/v1
          kind: ConfigurationPolicy
          name: rhoai-odhdash-check
          namespace: ""
          compliance: Compliant
      objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: rhoai-odhdash-maas
        spec:
          remediationAction: enforce
          severity: high
          pruneObjectBehavior: DeleteIfCreated
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: opendatahub.io/v1alpha
                kind: OdhDashboardConfig
                metadata:
                  name: odh-dashboard-config
                  namespace: redhat-ods-applications
                spec:
                  dashboardConfig:
                    genAiStudio: true
                    vLLMDeploymentOnMaaS: true
                    observabilityDashboard: true
                    modelAsService: true
                    disableTracking: false
                    disableKServeMetrics: false
                    disableLMEval: false
                    disableModelCatalog: false
                    disableModelRegistry: false
                    agentConfigManagement: true
                    agentOps: true
                    agentsCatalog: true
                    aiAssetCustomEndpoints: true
                    connectionTest: true
                    deploymentWizardYAMLViewer: true
                    externalModels: true
                    externalVectorStores: true
                    mcpCatalog: true
                    mcpRegistry: true
                    promptManagement: true
                    toolCalling: true
                    disableDistributedWorkloads: false
                    disableLLMd: false
                    featureStoreAdmin: true
                    gpuaas: true
                    # genAiTracing: true
                    # automl: true
                    # autorag: true
                    # enablement: true
                    # guardrails: true
                    # Deprecated in 3.5
                    #maasAuthPolicies: true
                  notebookController:
                    enabled: true
                    notebookNamespace: rhods-notebooks
                    pvcSize: 30Gi
                  genAiStudioConfig:
                    aiAssetCustomEndpoints:
                      externalProviders: true
                      clusterDomains:
                        - cluster.local
                        - svc.cluster.local
                        - svc

    - extraDependencies:
        - apiVersion: policy.open-cluster-management.io/v1
          kind: ConfigurationPolicy
          name: rhoai-odhdash-check
          namespace: ""
          compliance: Compliant
      objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: rhoai-mlflow
        spec:
          remediationAction: enforce
          severity: high
          pruneObjectBehavior: DeleteIfCreated
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: mlflow.opendatahub.io/v1
                kind: MLflow
                metadata:
                  name: mlflow
                  #namespace: redhat-ods-applications
                spec:
                  artifactsDestination: 'file:///mlflow/artifacts'
                  backendStoreUri: 'sqlite:////mlflow/mlflow.db'
                  replicas: 1
                  serveArtifacts: true
                  serviceAccountName: mlflow-sa
                  storage:
                    accessModes:
                      - ReadWriteOnce
                    resources:
                      requests:
                        storage: 10Gi
                  workers: 1
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: rhoai-metric-netpol
        spec:
          remediationAction: enforce
          severity: critical
          object-templates:
            - complianceType: musthave
              objectDefinition:
                kind: NetworkPolicy
                apiVersion: networking.k8s.io/v1
                metadata:
                  name: allow-from-openshift-monitoring
                  namespace: redhat-ods-monitoring
                spec:
                  podSelector: {}
                  ingress:
                    - from:
                        - namespaceSelector:
                            matchLabels:
                              network.openshift.io/policy-group: monitoring
                  policyTypes:
                    - Ingress

    # =================================================================================
    # MaaS Controller OOMKill Protection
    # =================================================================================
    - extraDependencies:
        - apiVersion: policy.open-cluster-management.io/v1
          kind: ConfigurationPolicy
          name: rhoai-mlflow
          namespace: ""
          compliance: Compliant
      objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: rhoai-mass-ctrl-check
        spec:
          remediationAction: inform
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: apps/v1
                kind: Deployment
                metadata:
                  name: maas-controller
                  namespace: redhat-ods-applications
                status:
                  conditions:
                    - status: 'True'
                      type: Available

    - extraDependencies:
        - apiVersion: policy.open-cluster-management.io/v1
          kind: ConfigurationPolicy
          name: rhoai-mass-ctrl-check
          namespace: ""
          compliance: Compliant
      objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: rhoai-mass-ctrl-limits
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: apps/v1
                kind: Deployment
                metadata:
                  name: maas-controller
                  namespace: redhat-ods-applications
                spec:
                  template:
                    spec:
                      containers:
                        - resources:
                            limits:
                              cpu: 500m
                              memory: 1Gi
                            requests:
                              cpu: 10m
                              memory: 64Mi
                          name: manager

    # =================================================================================
    # Feast Operator Controller OOMKill Protection
    # =================================================================================
    - extraDependencies:
        - apiVersion: policy.open-cluster-management.io/v1
          kind: ConfigurationPolicy
          name: rhoai-mlflow
          namespace: ""
          compliance: Compliant
      objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: rhoai-feast-check
        spec:
          remediationAction: inform
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: apps/v1
                kind: Deployment
                metadata:
                  name: opendatahub-feast-operator
                  namespace: redhat-ods-applications
                status:
                  conditions:
                    - status: 'True'
                      type: Available

    - extraDependencies:
        - apiVersion: policy.open-cluster-management.io/v1
          kind: ConfigurationPolicy
          name: rhoai-feast-check
          namespace: ""
          compliance: Compliant
      objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: rhoai-feast-limits
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: apps/v1
                kind: Deployment
                metadata:
                  name: opendatahub-feast-operator
                  namespace: redhat-ods-applications
                spec:
                  template:
                    spec:
                      containers:
                        - resources:
                            limits:
                              # cpu: 500m
                              memory: 1Gi
                            requests:
                              cpu: 10m
                              memory: 64Mi
                          name: manager

    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: rhoai-destrule-tls
        spec:
          remediationAction: enforce
          severity: high
          object-templates-raw: |
            {{- range $hc := (lookup "networking.istio.io/v1" "DestinationRule" "models-as-a-service" "" "app.kubernetes.io/managed-by=ipp-external-provider-reconciler").items }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: networking.istio.io/v1
                kind: DestinationRule
                metadata:
                  name: {{ $hc.metadata.name }}
                  namespace: {{ $hc.metadata.namespace }}
                spec:
                  trafficPolicy:
                    tls:
                      insecureSkipVerify: true
            {{- end }}