---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: operators-rh-cert-manager
  annotations:
    policy.open-cluster-management.io/description: Installs the Red Hat Cert-Manager Operator
    policy.open-cluster-management.io/categories: OCPOM - OpenShift Operator Management
    policy.open-cluster-management.io/standards: Kemo Labs 2025
    policy.open-cluster-management.io/controls: OLM-SUB - Operator Installation
spec:
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: rh-cert-manager-namespace
        spec:
          remediationAction: enforce
          severity: high
          pruneObjectBehavior: None
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: cert-manager-operator
                  labels:
                    openshift.io/cluster-monitoring: "true"


    - extraDependencies:
        - apiVersion: policy.open-cluster-management.io/v1
          kind: ConfigurationPolicy
          name: rh-cert-manager-namespace
          namespace: ""
          compliance: Compliant
      objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: rh-cert-manager-rm-og
        spec:
          remediationAction: enforce
          severity: low
          object-templates-raw: |
            {{- range $og := (lookup "operators.coreos.com/v1" "OperatorGroup" "" "").items }}
            {{- if and (ne $og.metadata.name "cert-manager-operator") (eq $og.metadata.namespace "cert-manager-operator") }}
            - complianceType: mustnothave
              objectDefinition:
                apiVersion: operators.coreos.com/v1
                kind: OperatorGroup
                metadata:
                  name: {{ $og.metadata.name }}
                  namespace: {{ $og.metadata.namespace }}
            {{- end }}
            {{- end }}

    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: rh-cert-manager-operatorgroup
        spec:
          remediationAction: enforce
          severity: high
          pruneObjectBehavior: DeleteIfCreated
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: operators.coreos.com/v1
                kind: OperatorGroup
                metadata:
                  name: cert-manager-operator
                  namespace: cert-manager-operator
                spec:
                  upgradeStrategy: Default
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: rh-cert-manager-subscription
        spec:
          remediationAction: enforce
          severity: high
          pruneObjectBehavior: DeleteIfCreated
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: operators.coreos.com/v1alpha1
                kind: Subscription
                metadata:
                  name: openshift-cert-manager-operator
                  namespace: cert-manager-operator
                spec:
                  channel: stable-v1
                  installPlanApproval: Automatic
                  name: openshift-cert-manager-operator
                  source: redhat-operators
                  sourceNamespace: openshift-marketplace