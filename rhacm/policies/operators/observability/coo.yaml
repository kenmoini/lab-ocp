---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: operators-coo
  annotations:
    policy.open-cluster-management.io/description: Installs the Cluster Observability Operator
    policy.open-cluster-management.io/categories: OCPOM - OpenShift Operator Management
    policy.open-cluster-management.io/standards: Kemo Labs 2025
    policy.open-cluster-management.io/controls: OLM-SUB - Operator Installation
spec:
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: coo-namespace
        spec:
          remediationAction: enforce
          severity: critical
          pruneObjectBehavior: None
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: openshift-cluster-observability-operator
                  labels:
                    openshift.io/cluster-monitoring: 'true'
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: coo-rbac
        spec:
          remediationAction: enforce
          severity: critical
          pruneObjectBehavior: DeleteIfCreated
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: RoleBinding
                metadata:
                  name: monitoring-sa-cluster-reader
                  namespace: openshift-cluster-observability-operator
                subjects:
                  - kind: ServiceAccount
                    name: monitoring-sa
                    namespace: openshift-cluster-observability-operator
                roleRef:
                  apiGroup: rbac.authorization.k8s.io
                  kind: ClusterRole
                  name: cluster-reader

    - extraDependencies:
        - apiVersion: policy.open-cluster-management.io/v1
          kind: ConfigurationPolicy
          name: coo-namespace
          namespace: ""
          compliance: Compliant
      objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: coo-rm-og
        spec:
          remediationAction: enforce
          severity: low
          object-templates-raw: |
            {{- range $og := (lookup "operators.coreos.com/v1" "OperatorGroup" "" "").items }}
            {{- if and (ne $og.metadata.name "coo-group") (eq $og.metadata.namespace "openshift-cluster-observability-operator") }}
            - complianceType: mustnothave
              objectDefinition:
                apiVersion: operators.coreos.com/v1
                kind: OperatorGroup
                metadata:
                  name: {{ $og.metadata.name }}
                  namespace: {{ $og.metadata.namespace }}
            {{- end }}
            {{- end }}

    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: coo-operator-group
        spec:
          remediationAction: enforce
          severity: high
          pruneObjectBehavior: DeleteIfCreated
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: operators.coreos.com/v1
                kind: OperatorGroup
                metadata:
                  name: coo-group
                  namespace: openshift-cluster-observability-operator
                spec:
                  upgradeStrategy: Default
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: coo-subscription
        spec:
          remediationAction: enforce
          severity: high
          pruneObjectBehavior: DeleteIfCreated
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: operators.coreos.com/v1alpha1
                kind: Subscription
                metadata:
                  name: cluster-observability-operator
                  namespace: openshift-cluster-observability-operator
                spec:
                  channel: stable
                  installPlanApproval: Manual
                  name: cluster-observability-operator
                  source: redhat-operators 
                  sourceNamespace: openshift-marketplace
                  startingCSV: cluster-observability-operator.v1.4.0
                  config:
                    resources:
                      requests:
                        memory: "512Mi"
                        cpu: "500m"
                      limits:
                        memory: "768Mi"
                        cpu: "800m"
