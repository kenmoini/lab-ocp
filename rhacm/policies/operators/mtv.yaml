apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: operators-mtv
  annotations:
    policy.open-cluster-management.io/description: Installs the Migration Toolkit for Virtualization Operator
    policy.open-cluster-management.io/categories: OCPOM - OpenShift Operator Management
    policy.open-cluster-management.io/standards: Kemo Labs 2025
    policy.open-cluster-management.io/controls: OLM-SUB - Operator Installation
spec:
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: mtv-namespace
        spec:
          remediationAction: enforce
          severity: critical
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: openshift-mtv
                  labels:
                    openshift.io/cluster-monitoring: "true"

    - extraDependencies:
        - apiVersion: policy.open-cluster-management.io/v1
          kind: ConfigurationPolicy
          name: mtv-namespace
          namespace: ""
          compliance: Compliant
      objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: mtv-rm-og
        spec:
          remediationAction: enforce
          severity: low
          object-templates-raw: |
            {{- range $og := (lookup "operators.coreos.com/v1" "OperatorGroup" "" "").items }}
            {{- if and (ne $og.metadata.name "mtv-group") (eq $og.metadata.namespace "openshift-mtv") }}
            - complianceType: mustnothave
              objectDefinition:
                apiVersion: operators.coreos.com/v1
                kind: OperatorGroup
                metadata:
                  name: {{ $og.metadata.name }}
                  namespace: {{ $og.metadata.namespace }}
            {{- end }}
            {{- end }}

    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: mtv-operator-group
        spec:
          remediationAction: enforce
          severity: high
          pruneObjectBehavior: DeleteIfCreated
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: operators.coreos.com/v1
                kind: OperatorGroup
                metadata:
                  name: mtv-group
                  namespace: openshift-mtv
                spec:
                  upgradeStrategy: Default
                  targetNamespaces:
                    - openshift-mtv
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: mtv-subscription
        spec:
          remediationAction: enforce
          severity: high
          pruneObjectBehavior: DeleteIfCreated
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: operators.coreos.com/v1alpha1
                kind: Subscription
                metadata:
                  name: mtv-operator
                  namespace: openshift-mtv
                spec:
                  channel: release-v2.9
                  installPlanApproval: Automatic
                  name: mtv-operator
                  source: redhat-operators 
                  sourceNamespace: openshift-marketplace
