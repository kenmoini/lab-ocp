---
# https://medium.com/@mprzygrodzki/argocd-applicationsset-with-helm-72bb6362d494
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: jenkins
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  appset/helm-jenkins: enabled
          - list:
              elements:
              - appName: jenkins
                namespace: jenkins
                helmRepoURL: 'https://charts.jenkins.io'
                helmChartName: jenkins
                helmRevision: 5.9.68
  template:
    metadata:
      name: "{{.name}}-{{.appName}}"
      annotations:
        argocd.argoproj.io/manifest-generate-paths: ".;.."
        argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true
      finalizers:
        # The set foreground cascading deletion
        - resources-finalizer.argocd.argoproj.io
    spec:
      ignoreDifferences:
        - group: apiextensions.k8s.io
          jsonPointers:
            - /status
          kind: CustomResourceDefinition
      project: default
      sources:
        - chart: '{{.helmChartName}}'
          helm:
            valuesObject:
              controller:
                route:
                  enabled: true
              additionalPlugins:
                - stackrox-container-image-scanner:1.4.5
              initializeOnce: false
              persistence:
                enabled: true
                size: "10Gi"
              rbac:
                useOpenShiftNonRootSCC: true
          repoURL: '{{.helmRepoURL}}'
          targetRevision: '{{.helmRevision}}'
      destination:
        name: "{{.name}}"
        namespace: "{{.namespace}}"
      syncPolicy:
        managedNamespaceMetadata:
          labels: # The labels to set on the application namespace
            security.openshift.io/scc.podSecurityLabelSync: 'false'
            pod-security.kubernetes.io/enforce: privileged
            pod-security.kubernetes.io/audit: privileged
            pod-security.kubernetes.io/warn: privileged
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - SkipDryRunOnMissingResource=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 5
