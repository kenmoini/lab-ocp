---
# https://medium.com/@mprzygrodzki/argocd-applicationsset-with-helm-72bb6362d494
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gitlab
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchExpressions:
                  - key: ensemble/gitlab
                    operator: In
                    values:
                      - "true"
                      - "enable"
                      - "enabled"
          - list:
              elements:
              - appName: gitlab
                namespace: gitlab-system
                helmRepoURL: 'oci://registry.gitlab.com/charts/charts.gitlab.io/release/gitlab-operator'
                helmChartName: gitlab-operator
                helmRevision: 3.5.0
                helmReleaseName: gitlab-operator

                redisRepoURL: 'oci://registry-1.docker.io/bitnamicharts/redis'
                redisReleaseName: gitlab-redis
                redisHelmChartName: redis
                redisHelmRevision: 23.1.3
  template:
    metadata:
      name: "{{.name}}-{{.appName}}"
      annotations:
        argocd.argoproj.io/manifest-generate-paths: ".;.."
        argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true
      finalizers:
        # The set foreground cascading deletion
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      sources:
        - ref: values
          repoURL: 'https://github.com/kenmoini/lab-ocp'
          targetRevision: main
        # - kustomize: {}
        #   repoURL: 'https://github.com/kenmoini/lab-ocp'
        #   ## Path is the repo directory that containers the cluster(s) configuration and deployment manifests
        #   path: configuration/gitlab-operator/instance/
        # Redis Chart
        - repoURL: '{{.redisRepoURL}}'
          chart: '{{.redisHelmChartName}}'
          targetRevision: '{{.redisHelmRevision}}'
          helm:
            releaseName: '{{.redisReleaseName}}'
            valueFiles:
              - "$values/clusters/{{ .name }}/helm-values/{{ .redisReleaseName }}.yaml"

        # - repoURL: '{{.helmRepoURL}}'
        #   chart: '{{.helmChartName}}'
        #   targetRevision: '{{.helmRevision}}'
        #   helm:
        #     releaseName: '{{.helmReleaseName}}'
        #     valueFiles:
        #       - "$values/clusters/{{ .name }}/helm-values/{{ .helmReleaseName }}.yaml"
        #     valuesObject:
        #       global:
        #         redis:
        #           host: '{{.redisReleaseName}}-headless'
        #           auth:
        #             secret: '{{.redisReleaseName}}'
        #             key: redis-password

      destination:
        name: "{{.name}}"
        namespace: "{{.namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - SkipDryRunOnMissingResource=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 5
