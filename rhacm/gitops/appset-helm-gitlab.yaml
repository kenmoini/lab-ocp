---
# https://medium.com/@mprzygrodzki/argocd-applicationsset-with-helm-72bb6362d494
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gitlab
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchExpressions:
                  - key: ensemble/gitlab
                    operator: In
                    values:
                      - "true"
                      - "enable"
                      - "enabled"
          - list:
              elements:
              - appName: gitlab
                namespace: gitlab-system

                helmRepoURL: 'https://charts.gitlab.io'
                helmChartName: gitlab
                helmReleaseName: gitlab
                helmRevision: 10.5.1 # https://docs.gitlab.com/charts/installation/version_mappings/
                gitlabVersion: 19.5.1

                redisReleaseName: gitlab-redis
                redisHelmChartName: redis
                redisHelmRevision: 23.1.3
  template:
    metadata:
      name: "{{.name}}-{{.appName}}"
      annotations:
        argocd.argoproj.io/manifest-generate-paths: ".;.."
        argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true
        argocd.argoproj.io/refresh: hard
      finalizers:
        # The set foreground cascading deletion
        - resources-finalizer.argocd.argoproj.io
    spec:
      ignoreDifferences:
        - group: apps/v1
          kind: StatefulSet
          jsonPointers:
            - /metadata/generation
      project: default
      sources:
        - ref: values
          repoURL: 'https://github.com/kenmoini/lab-ocp'
          targetRevision: main
        # - kustomize: {}
        #   repoURL: 'https://github.com/kenmoini/lab-ocp'
        #   ## Path is the repo directory that containers the cluster(s) configuration and deployment manifests
        #   path: configuration/gitlab-operator/instance/
        - repoURL: '{{.helmRepoURL}}'
          chart: '{{.helmChartName}}'
          targetRevision: '{{.helmRevision}}'
          helm:
            releaseName: '{{.helmReleaseName}}'
            valueFiles:
              - "$values/clusters/{{ .name }}/helm-values/{{ .helmReleaseName }}.yaml"
            # valuesObject:
            #   gitlab-runner:
            #     image:
            #       # Replace 'X.Y.Z' with desired GitLab version.
            #       # `skopeo` can be used to find available tags:
            #       #   skopeo list-tags docker://registry.gitlab.com/gitlab-org/gitlab-runner | jq '.Tags' | grep 'ubi-fips-v'
            #       tag: ubi-fips-v{{ .gitlabVersion }}

      destination:
        name: '{{if ne .name "hub-cluster"}}{{.name}}{{end}}'
        server: '{{if eq .name "hub-cluster"}}https://kubernetes.default.svc{{end}}'
        namespace: "{{.namespace}}"
      syncPolicy:
        managedNamespaceMetadata:
          labels: # The labels to set on the application namespace
            openshift.io/cluster-monitoring: 'true'
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - SkipDryRunOnMissingResource=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
          - ApplyOutOfSyncOnly=true
        retry:
          limit: 5
