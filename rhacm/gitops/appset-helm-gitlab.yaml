---
# https://medium.com/@mprzygrodzki/argocd-applicationsset-with-helm-72bb6362d494
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gitlab
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchExpressions:
                  - key: ensemble/gitlab
                    operator: In
                    values:
                      - "true"
                      - "enable"
                      - "enabled"
          - list:
              elements:
              - appName: gitlab
                namespace: gitlab-system

                helmRepoURL: 'https://charts.gitlab.io'
                helmChartName: gitlab
                helmReleaseName: gitlab
                helmRevision: 10.5.0 # https://docs.gitlab.com/charts/installation/version_mappings/
                gitlabVersion: 19.5.0

                redisRepoURL: 'oci://registry-1.docker.io/bitnamicharts/redis'
                redisReleaseName: gitlab-redis
                redisHelmChartName: redis
                redisHelmRevision: 23.1.3
  template:
    metadata:
      name: "{{.name}}-{{.appName}}"
      annotations:
        argocd.argoproj.io/manifest-generate-paths: ".;.."
        argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true
      finalizers:
        # The set foreground cascading deletion
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      sources:
        - ref: values
          repoURL: 'https://github.com/kenmoini/lab-ocp'
          targetRevision: main
        # - kustomize: {}
        #   repoURL: 'https://github.com/kenmoini/lab-ocp'
        #   ## Path is the repo directory that containers the cluster(s) configuration and deployment manifests
        #   path: configuration/gitlab-operator/instance/
        # Redis Chart
        - repoURL: '{{.redisRepoURL}}'
          chart: '{{.redisHelmChartName}}'
          targetRevision: '{{.redisHelmRevision}}'
          helm:
            releaseName: '{{.redisReleaseName}}'
            valueFiles:
              - "$values/clusters/{{ .name }}/helm-values/{{ .redisReleaseName }}.yaml"

        - repoURL: '{{.helmRepoURL}}'
          chart: '{{.helmChartName}}'
          targetRevision: '{{.helmRevision}}'
          helm:
            releaseName: '{{.helmReleaseName}}'
            valueFiles:
              - "$values/clusters/{{ .name }}/helm-values/{{ .helmReleaseName }}.yaml"
            valuesObject:
              gitlab-runner:
                image:
                  # Replace 'X.Y.Z' with desired GitLab version.
                  # `skopeo` can be used to find available tags:
                  #   skopeo list-tags docker://registry.gitlab.com/gitlab-org/gitlab-runner | jq '.Tags' | grep 'ubi-fips-v'
                  tag: ubi-fips-v{{ .gitlabVersion }}
              global:
                redis:
                  host: '{{.redisReleaseName}}-master'
                  port: 6379
                  username: default
                  auth:
                    secret: '{{.redisReleaseName}}'
                    key: redis-password
                    enabled: true

      destination:
        name: '{{if ne .name "hub-cluster"}}{{.name}}{{end}}'
        server: '{{if eq .name "hub-cluster"}}https://kubernetes.default.svc{{end}}'
        namespace: "{{.namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - SkipDryRunOnMissingResource=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
          - ApplyOutOfSyncOnly=true
        retry:
          limit: 5
