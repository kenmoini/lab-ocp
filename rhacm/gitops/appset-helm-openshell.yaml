---
# https://medium.com/@mprzygrodzki/argocd-applicationsset-with-helm-72bb6362d494
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: openshell
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchExpressions:
                  - key: appset/helm-openshell
                    operator: In
                    values:
                      - "true"
                      - "enable"
                      - "enabled"
          - list:
              elements:
              - appName: openshell
                namespace: openshell
                helmRepoURL: 'oci://ghcr.io/nvidia/openshell/helm-chart'
                helmChartName: openshell
                helmRevision: 0.1.4
  template:
    metadata:
      name: "{{.name}}-{{.appName}}"
      annotations:
        argocd.argoproj.io/manifest-generate-paths: ".;.."
        argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true
      finalizers:
        # The set foreground cascading deletion
        - resources-finalizer.argocd.argoproj.io
    spec:
      ignoreDifferences:
        - group: apiextensions.k8s.io
          jsonPointers:
            - /status
          kind: CustomResourceDefinition
      project: default
      sources:
        - kustomize: {}
          repoURL: 'https://github.com/kenmoini/lab-ocp'
          ## Path is the repo directory that containers the cluster(s) configuration and deployment manifests
          path: configuration/openshell/global/
        - chart: '{{.helmChartName}}'
          helm:
            valuesObject:
              replicaCount: 2
              workload:
                kind: deployment
              affinity:
                podAntiAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    - labelSelector:
                        matchLabels:
                          app.kubernetes.io/name: openshell
                          app.kubernetes.io/instance: openshell
                      topologyKey: kubernetes.io/hostname
              # securityContext:
              #   runAsUser: 1000
              # podSecurityContext:
              #   fsGroup: 1000
              certManager:
                enabled: true
                serverIssuerRef:
                  name: letsencrypt-digitalocean
                  kind: ClusterIssuer
                serverDnsNames:
                  - openshell-gw.apps.tri-force.lab.kemo.network
              grpcRoute:
                enabled: false
                backendTLSPolicy:
                  enabled: false
                gateway:
                  name: openshell-gateway
                  namespace: openshift-ingress
                hostnames:
                  - openshell-gw.apps.tri-force.lab.kemo.network
              # gatewayConfig:
              #   openshell:
              #     gateway:
              #       allowUnauthenticatedUsers: false
              openshiftRoute:
                enabled: true
                host: openshell-gw.apps.tri-force.lab.kemo.network
              supervisor:
                topology: sidecar
                sidecar:
                  processBinaryAwareNetworkPolicy: true
              server:
                disableTls: false
                telemetryEnabled: false
                externalDbSecret: openshell-db-app
                # Use either Kata or User namespaces, cannot be both
                defaultRuntimeClassName: kata
                sandboxUid: 1000
                sandboxGid: 1000
                # enableUserNamespaces: true
                auth:
                  allowUnauthenticatedUsers: false
                oidc:
                  issuer: "https://openshell-sso.apps.tri-force.lab.kemo.network/realms/openshell"
                  audience: "openshell-cli"
                  roles_claim: "realm_access.roles"
                  admin_role: "openshell-admin"
                  user_role: "openshell-user"
                  caConfigMapName: "trusted-cabundle"
                tls:
                  enableMtls: false
                  clientCaSecretName: ""
                credentialDrivers:
                  kubernetesSecrets:
                    enabled: true
                    namespace: openshell-credentials
                    createNamespace: true
                drivers:
                  kubernetes:
                    allowDriverConfig: true
                    resourceAdmission:
                      enabled: false
                      # requiredLabels:
                      #   app.kubernetes.io/part-of: "openshell"
          repoURL: '{{.helmRepoURL}}'
          targetRevision: '{{.helmRevision}}'
      destination:
        name: "{{.name}}"
        namespace: "{{.namespace}}"
      syncPolicy:
        # Needed for User Namespaces
        # managedNamespaceMetadata:
        #   annotations:
        #     openshift.io/sa.scc.supplemental-groups: 1000/165537
        #     openshift.io/sa.scc.uid-range: 1000/165537
          # labels: # The labels to set on the application namespace
          #   security.openshift.io/scc.podSecurityLabelSync: 'false'
          #   pod-security.kubernetes.io/enforce: privileged
          #   pod-security.kubernetes.io/audit: privileged
          #   pod-security.kubernetes.io/warn: privileged
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - SkipDryRunOnMissingResource=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 5
