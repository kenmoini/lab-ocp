---
# https://medium.com/@mprzygrodzki/argocd-applicationsset-with-helm-72bb6362d494
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: openshell
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchExpressions:
                  - key: appset/helm-openshell
                    operator: In
                    values:
                      - "true"
                      - "enable"
                      - "enabled"
          - list:
              elements:
              - appName: openshell
                namespace: openshell
                helmRepoURL: 'oci://ghcr.io/nvidia/openshell/helm-chart'
                helmChartName: openshell
                helmRevision: 0.1.4
  template:
    metadata:
      name: "{{.name}}-{{.appName}}"
      annotations:
        argocd.argoproj.io/manifest-generate-paths: ".;.."
        argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true
      finalizers:
        # The set foreground cascading deletion
        - resources-finalizer.argocd.argoproj.io
    spec:
      ignoreDifferences:
        - group: apiextensions.k8s.io
          jsonPointers:
            - /status
          kind: CustomResourceDefinition
      project: default
      sources:
        - kustomize: {}
          repoURL: 'https://github.com/kenmoini/lab-ocp'
          ## Path is the repo directory that containers the cluster(s) configuration and deployment manifests
          path: configuration/openshell/global/
        - chart: '{{.helmChartName}}'
          helm:
            valuesObject:
              grpcRoute:
                enabled: true
                backendTLSPolicy:
                  enabled: true
                gateway:
                  name: openshell-gateway
                  namespace: openshift-ingress
                hostnames:
                  - openshell-gw.lab.kemo.network
              openshiftRoute:
                enabled: true
                # host: openshell.apps.tri-force.lab.kemo.network
              server:
                enableUserNamespaces: true
                tls:
                  enableMtls: false
                credentialDrivers:
                  kubernetesSecrets:
                    enabled: true
                    namespace: openshell-credentials
                    createNamespace: true
          repoURL: '{{.helmRepoURL}}'
          targetRevision: '{{.helmRevision}}'
      destination:
        name: "{{.name}}"
        namespace: "{{.namespace}}"
      syncPolicy:
        managedNamespaceMetadata:
          annotations:
            openshift.io/sa.scc.supplemental-groups: 1000/165537
            openshift.io/sa.scc.uid-range: 1000/165537
          # labels: # The labels to set on the application namespace
          #   security.openshift.io/scc.podSecurityLabelSync: 'false'
          #   pod-security.kubernetes.io/enforce: privileged
          #   pod-security.kubernetes.io/audit: privileged
          #   pod-security.kubernetes.io/warn: privileged
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - SkipDryRunOnMissingResource=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 5
