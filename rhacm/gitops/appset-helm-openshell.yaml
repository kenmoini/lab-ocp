---
# https://medium.com/@mprzygrodzki/argocd-applicationsset-with-helm-72bb6362d494
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: openshell
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchExpressions:
                  - key: appset/helm-openshell
                    operator: In
                    values:
                      - "true"
                      - "enable"
                      - "enabled"
          - list:
              elements:
              - appName: openshell
                namespace: openshell
                helmRepoURL: 'oci://ghcr.io/nvidia/openshell/helm-chart'
                helmChartName: openshell
                helmRevision: 0.1.3
  template:
    metadata:
      name: "{{.name}}-{{.appName}}"
      annotations:
        argocd.argoproj.io/manifest-generate-paths: ".;.."
        argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true
      finalizers:
        # The set foreground cascading deletion
        - resources-finalizer.argocd.argoproj.io
    spec:
      ignoreDifferences:
        - group: apiextensions.k8s.io
          jsonPointers:
            - /status
          kind: CustomResourceDefinition
      project: default
      sources:
        - kustomize: {}
          repoURL: 'https://github.com/kenmoini/lab-ocp'
          ## Path is the repo directory that containers the cluster(s) configuration and deployment manifests
          path: configuration/openshell/global/
        - ref: values
          repoURL: 'https://github.com/kenmoini/lab-ocp'
          targetRevision: main
        - chart: '{{.helmChartName}}'
          helm:
            valuesObject:
              global:
                image:
                  registry: quay.io/opendatahub
                  tag: "v{{ .helmRevision }}-rhaiv.3"
            valueFiles:
              - "$values/clusters/{{ .name }}/helm-values/{{ .appName }}.yaml"
          repoURL: '{{.helmRepoURL}}'
          targetRevision: '{{.helmRevision}}'
      destination:
        name: '{{if ne .name "hub-cluster"}}{{.name}}{{end}}'
        server: '{{if eq .name "hub-cluster"}}https://kubernetes.default.svc{{end}}'
        namespace: "{{.namespace}}"
      syncPolicy:
        # Needed for User Namespaces
        # managedNamespaceMetadata:
        #   annotations:
        #     openshift.io/sa.scc.supplemental-groups: 1000/165537
        #     openshift.io/sa.scc.uid-range: 1000/165537
          # labels: # The labels to set on the application namespace
          #   security.openshift.io/scc.podSecurityLabelSync: 'false'
          #   pod-security.kubernetes.io/enforce: privileged
          #   pod-security.kubernetes.io/audit: privileged
          #   pod-security.kubernetes.io/warn: privileged
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - SkipDryRunOnMissingResource=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
          - ApplyOutOfSyncOnly=true
        retry:
          limit: 5
