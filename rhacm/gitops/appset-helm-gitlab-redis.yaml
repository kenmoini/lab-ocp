---
# https://medium.com/@mprzygrodzki/argocd-applicationsset-with-helm-72bb6362d494
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gitlab-redis
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchExpressions:
                  - key: ensemble/gitlab
                    operator: In
                    values:
                      - "true"
                      - "enable"
                      - "enabled"
          - list:
              elements:
              - appName: gitlab-redis
                namespace: gitlab-infra

                helmRepoURL: 'oci://registry-1.docker.io/bitnamicharts/redis'
                helmChartName: redis
                helmReleaseName: gitlab-redis
                helmRevision: 23.1.3
  template:
    metadata:
      name: "{{.name}}-{{.appName}}"
      annotations:
        argocd.argoproj.io/manifest-generate-paths: ".;.."
        argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true
      finalizers:
        # The set foreground cascading deletion
        - resources-finalizer.argocd.argoproj.io
    spec:
      ignoreDifferences:
        - group: apps/v1
          kind: StatefulSet
          jsonPointers:
            - /metadata/generation
      project: default
      sources:
        - ref: values
          repoURL: 'https://github.com/kenmoini/lab-ocp'
          targetRevision: main
        # Redis Chart
        - repoURL: '{{.helmRepoURL}}'
          chart: '{{.helmChartName}}'
          targetRevision: '{{.helmRevision}}'
          helm:
            releaseName: '{{.helmReleaseName}}'
            valueFiles:
              - "$values/clusters/{{ .name }}/helm-values/{{ .helmReleaseName }}.yaml"

      destination:
        name: '{{if ne .name "hub-cluster"}}{{.name}}{{end}}'
        server: '{{if eq .name "hub-cluster"}}https://kubernetes.default.svc{{end}}'
        namespace: "{{.namespace}}"
      syncPolicy:
        managedNamespaceMetadata:
          labels: # The labels to set on the application namespace
            openshift.io/cluster-monitoring: 'true'
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - SkipDryRunOnMissingResource=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
          - ApplyOutOfSyncOnly=true
        retry:
          limit: 5
