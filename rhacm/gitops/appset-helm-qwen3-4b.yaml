---
# https://medium.com/@mprzygrodzki/argocd-applicationsset-with-helm-72bb6362d494
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: qwen3-4b
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchExpressions:
                  - key: policy.kemo.dev/openshift-ai
                    operator: In
                    values:
                      - "true"
                      - "enable"
                      - "enabled"
          - list:
              elements:
              - appName: qwen3-4b
                namespace: models-as-a-service
                #helmRepoURL: 'https://redhat-ai-services.github.io/helm-charts/'
                helmRepoURL: 'https://github.com/kenmoini/rh-ai-svcs-helm-charts/'
                helmChartName: vllm-kserve
                helmRevision: main
                #helmRevision: 0.7.1
  template:
    metadata:
      name: "{{.name}}-{{.appName}}"
      annotations:
        argocd.argoproj.io/manifest-generate-paths: ".;.."
        argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true
      finalizers:
        # The set foreground cascading deletion
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      sources:
        - ref: values
          repoURL: 'https://github.com/redhat-ai-services/modelcar-catalog'
          targetRevision: main
        - helm:
            releaseName: '{{.appName}}'
            valueFiles:
              - "$values/modelcar-images/qwen/qwen3-4b/values.yaml"
            parameters:
              - name: endpoint.externalRoute.enabled
                value: 'false'
              - name: endpoint.auth.enabled
                value: 'false'
            valuesObject:
              nodeSelector:
                kubernetes.io/hostname: endurance
              resources:
                requests:
                  nvidia.com/gpu: 8
                  memory: 8Gi
                  cpu: 4
                limits:
                  nvidia.com/gpu: 8
                  memory: 8Gi
              scaling:
                rawDeployment:
                  # -- The deployment strategy to use to replace existing pods with new ones.
                  deploymentStrategy:
                    # Can be type of RollingUpdate or Recreate
                    type: RollingUpdate
          repoURL: '{{.helmRepoURL}}'
          path: "charts/{{.helmChartName}}"
          targetRevision: '{{.helmRevision}}'
      destination:
        name: '{{if ne .name "hub-cluster"}}{{.name}}{{end}}'
        server: '{{if eq .name "hub-cluster"}}https://kubernetes.default.svc{{end}}'
        namespace: "{{.namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=false
          - SkipDryRunOnMissingResource=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
          - ApplyOutOfSyncOnly=true
        retry:
          limit: 10
