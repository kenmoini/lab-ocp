---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: ensembles-gitlab
  #namespace: open-cluster-management-policies
placementRef:
  name: ensemble-gitlab
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
subjects:
  - name: gitlab-chart-db
    apiGroup: policy.open-cluster-management.io
    kind: Policy
  - name: gitlab-chart-s3
    apiGroup: policy.open-cluster-management.io
    kind: Policy
  - name: gitlab-chart-rbac
    apiGroup: policy.open-cluster-management.io
    kind: Policy
  - name: gitlab-chart-netpol
    apiGroup: policy.open-cluster-management.io
    kind: Policy
  - name: gitlab-chart-ingress
    apiGroup: policy.open-cluster-management.io
    kind: Policy
