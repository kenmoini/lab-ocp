---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: enable-iommu
  #namespace: open-cluster-management-policies
spec:
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: policy.kemo.dev/enable-iommu
              operator: In
              values:
                - "true"
                - "enable"
                - "enabled"