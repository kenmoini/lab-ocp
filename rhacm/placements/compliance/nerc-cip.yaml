---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: nerc-cip
spec:
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: compliance.kemo.dev/nerc-cip
              operator: In
              values:
                - 'true'
                - 'enable'
                - 'enabled'