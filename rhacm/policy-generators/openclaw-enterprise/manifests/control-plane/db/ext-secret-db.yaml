---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: vault-oce-db-app
  namespace: openclaw-infra
spec:
  refreshInterval: "3600s"
  secretStoreRef:
    name: kemo-labs-vault
    kind: ClusterSecretStore
  target:
    name: openclaw-db-app
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
      labels:
        cnpg.io/reload: "true"
  data:
    - secretKey: username
      remoteRef:
        key: ursula/databases/openclaw
        property: appUsername
    - secretKey: password
      remoteRef:
        key: ursula/databases/openclaw
        property: appPassword
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: vault-oce-db-migration
  namespace: openclaw-infra
spec:
  refreshInterval: "3600s"
  secretStoreRef:
    name: kemo-labs-vault
    kind: ClusterSecretStore
  target:
    name: openclaw-db-migration
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
      labels:
        cnpg.io/reload: "true"
  data:
    - secretKey: username
      remoteRef:
        key: ursula/databases/openclaw
        property: appUsername
    - secretKey: password
      remoteRef:
        key: ursula/databases/openclaw
        property: appPassword
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: vault-oce-db
  namespace: openclaw-system
spec:
  refreshInterval: "3600s"
  secretStoreRef:
    name: kemo-labs-vault
    kind: ClusterSecretStore
  target:
    name: occ-database
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
      labels:
        cnpg.io/reload: "true"
      data:
        application-url: "postgresql://`{{ .appUsername }}`:`{{ .appPassword }}`@openclaw-db-rw.openclaw-infra:5432/oceapp"
        migration-url: "postgresql://`{{ .migrationUsername }}`:`{{ .migrationPassword }}`@openclaw-db-rw.openclaw-infra:5432/ocemigration"
  data:
    - secretKey: appUsername
      remoteRef:
        key: ursula/databases/openclaw
        property: appUsername
    - secretKey: appPassword
      remoteRef:
        key: ursula/databases/openclaw
        property: appPassword
    - secretKey: migrationUsername
      remoteRef:
        key: ursula/databases/openclaw
        property: migrationUsername
    - secretKey: migrationPassword
      remoteRef:
        key: ursula/databases/openclaw
        property: migrationPassword
