---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: vault-oce-keycloak
  namespace: openclaw-system
spec:
  refreshInterval: "3600s"
  secretStoreRef:
    name: kemo-labs-vault
    kind: ClusterSecretStore
  target:
    name: occ-oidc-login
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
      data:
        clientID: openclaw
        clientSecret: {{ `{{ .clientSecret }}` }}
  data:
    - secretKey: clientSecret
      remoteRef:
        key: kemo.labs/oauth/keycloak/openshell
        property: openclawClientSecret