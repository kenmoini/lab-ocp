apiVersion: policy.open-cluster-management.io/v1
kind: PolicyGenerator
metadata:
  name: tgtd-mcp-openshift-storage
policySetDefaults:
  generatePolicySetPlacement: false
policyDefaults:
  generatePolicyPlacement: false
  namespace: openshift-storage
  categories: 
  - AI - Artificial Intelligence
  controls:
  - MCP - Model Context Protocol
  standards:
  - Kemo Labs 2026
  # remediationAction: enforce
  severity: low
  pruneObjectBehavior: DeleteIfCreated
  consolidateManifests: false # Put each object in its own ConfigurationPolicy in the Policy
policies:
  - name: tgtd-mcp-ocp-storage
    manifests:
      - name: "tgtd-mcp-ocp-storage"
        path: manifests/targeted/openshift-storage/
        complianceType: "musthave"
        remediationAction: enforce