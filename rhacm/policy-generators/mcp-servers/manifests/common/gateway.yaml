apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  annotations:
    security.opendatahub.io/authorino-tls-bootstrap: 'true'
  name: mcp-gateway
  namespace: openshift-ingress
  labels:
    istio.io/rev: openshift-gateway
spec:
  gatewayClassName: openshift-default
  infrastructure:
    parametersRef:
      group: ''
      kind: ConfigMap
      name: mcp-default-gateway-config
  listeners:
    - allowedRoutes:
        namespaces:
          from: All
      hostname: '*.apps.tri-force.lab.kemo.network'
      name: http
      port: 80
      protocol: HTTP
    - allowedRoutes:
        namespaces:
          from: All
      hostname: '*.apps.tri-force.lab.kemo.network'
      name: https
      port: 443
      protocol: HTTPS
      tls:
        certificateRefs:
          - group: ''
            kind: Secret
            name: ingress-lb-tls
        mode: Terminate