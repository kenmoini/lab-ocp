apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: mcp-gateway-httproutes
  namespace: openshift-ingress
spec:
  to:
    - group: ''
      kind: Service
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: mcp-gateway
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: mcp-servers
