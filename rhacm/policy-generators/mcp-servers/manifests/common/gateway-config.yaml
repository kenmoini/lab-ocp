kind: ConfigMap
apiVersion: v1
metadata:
  name: mcp-default-gateway-config
  namespace: openshift-ingress
data:
  deployment: |
    metadata:
      labels:
        istio-prometheus-ignore: ""
    spec:
      template:
        metadata:
          labels:
            istio-prometheus-ignore: ""
        spec:
          containers:
          - name: istio-proxy
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: "2"
                memory: 2Gi
  service: |
    spec:
      type: ClusterIP
