apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openshift-mcp
  namespace: mcp-servers
spec:
  hostnames:
    - openshift-mcp.apps.tri-force.lab.kemo.network
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: openshift-ingress
      sectionName: https
  rules:
    - backendRefs:
        - group: ''
          kind: Service
          name: openshift-mcp
          port: 8080
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
