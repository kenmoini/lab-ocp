---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ursula-db-tls-ca
  namespace: ursula-infra
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  commonName: ursula-db-ca
  isCA: true
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: ursula-db-selfsigned
  privateKey:
    algorithm: ECDSA
    size: 256
  secretName: ursula-db-tls-ca