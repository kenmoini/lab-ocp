---
apiVersion: v1
kind: Secret
metadata:
  name: ursula-db-app
  namespace: ursula
type: Opaque
stringData:
  port: '5432'
  dbname: 'ursula'
  host: ursula-db-rw
  uri: 'postgresql://{{ fromSecret "ursula-infra" "ursula-db-ursula" "username" | base64dec }}:{{ fromSecret "ursula-infra" "ursula-db-ursula" "password" | base64dec }}@ursula-db-rw.ursula-infra:5432/ursula'
  fqdn-uri: 'postgresql://{{ fromSecret "ursula-infra" "ursula-db-ursula" "username" | base64dec }}:{{ fromSecret "ursula-infra" "ursula-db-ursula" "password" | base64dec }}@ursula-db-rw.ursula-infra.svc.cluster.local:5432/ursula'
  password: '{{ fromSecret "ursula-infra" "ursula-db-ursula" "password" | base64dec }}'
  username: '{{ fromSecret "ursula-infra" "ursula-db-ursula" "username" | base64dec }}'
  name: '{{ fromSecret "ursula-infra" "ursula-db-ursula" "username" | base64dec }}'
  pgpass: |
    ursula-db-rw.ursula.svc.cluster.local:5432:ursula:{{ fromSecret "ursula-infra" "ursula-db-ursula" "username" | base64dec }}:{{ fromSecret "ursula-infra" "ursula-db-ursula" "password" | base64dec }}