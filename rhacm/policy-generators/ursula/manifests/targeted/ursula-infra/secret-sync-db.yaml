---
apiVersion: v1
kind: Secret
metadata:
  name: ursula-db-app
  namespace: ursula-system
type: Opaque
stringData:
  port: '5432'
  dbname: 'ursula'
  host: ursula-db-rw
  uri: 'postgresql://{{ fromSecret "ursula-infra" "ursula-db-ursula" "username" }}:{{ fromSecret "ursula-infra" "ursula-db-ursula" "password" }}@ursula-db-rw.ursula-infra:5432/ursula'
  fqdn-uri: 'postgresql://{{ fromSecret "ursula-infra" "ursula-db-ursula" "username" }}:{{ fromSecret "ursula-infra" "ursula-db-ursula" "password" }}@ursula-db-rw.ursula-infra.svc.cluster.local:5432/ursula'
  password: '{{ fromSecret "ursula-infra" "ursula-db-ursula" "password" }}'
  username: '{{ fromSecret "ursula-infra" "ursula-db-ursula" "username" }}'
  name: '{{ fromSecret "ursula-infra" "ursula-db-ursula" "username" }}'
  pgpass: |
    {{ fromSecret "ursula-infra" "ursula-db-ursula" "host" }}:{{ fromSecret "ursula-infra" "ursula-db-ursula" "port" }}:{{ fromSecret "ursula-infra" "ursula-db-ursula" "dbname" }}:{{ fromSecret "ursula-infra" "ursula-db-ursula" "username" }}:{{ fromSecret "ursula-infra" "ursula-db-ursula" "password" }}