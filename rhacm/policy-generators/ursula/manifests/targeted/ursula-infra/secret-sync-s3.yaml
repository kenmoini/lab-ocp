---
apiVersion: v1
kind: Secret
metadata:
  name: s3-ursula-artifacts
  namespace: ursula
type: Opaque
data:
  AWS_ACCESS_KEY_ID: '{{ fromSecret "ursula-infra" "s3-ursula-artifacts" "AWS_ACCESS_KEY_ID" }}'
  AWS_SECRET_ACCESS_KEY: '{{ fromSecret "ursula-infra" "s3-ursula-artifacts" "AWS_SECRET_ACCESS_KEY" }}'