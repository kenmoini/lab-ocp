---
apiVersion: v1
kind: ConfigMap
metadata:
  name: s3-ursula-artifacts
  namespace: ursula
  labels:
    app: noobaa
    bucket-provisioner: openshift-storage.noobaa.io-obc
    noobaa-domain: openshift-storage.noobaa.io
data:
  BUCKET_HOST: '{{ fromConfigMap "ursula-infra" "s3-ursula-artifacts" "BUCKET_HOST" }}'
  BUCKET_NAME: '{{ fromConfigMap "ursula-infra" "s3-ursula-artifacts" "BUCKET_NAME" }}'
  BUCKET_PORT: '{{ fromConfigMap "ursula-infra" "s3-ursula-artifacts" "BUCKET_PORT" }}'
  BUCKET_REGION: '{{ fromConfigMap "ursula-infra" "s3-ursula-artifacts" "BUCKET_REGION" }}'
  BUCKET_SUBREGION: '{{ fromConfigMap "ursula-infra" "s3-ursula-artifacts" "BUCKET_SUBREGION" }}'
