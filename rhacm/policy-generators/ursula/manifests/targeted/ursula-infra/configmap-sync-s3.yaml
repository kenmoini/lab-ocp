---
apiVersion: v1
kind: ConfigMap
metadata:
  name: s3-ursula-artifacts
  namespace: ursula
  labels:
    app: noobaa
    bucket-provisioner: openshift-storage.noobaa.io-obc
    noobaa-domain: openshift-storage.noobaa.io
data:
  BUCKET_HOST: '{{ fromSecret "ursula-infra" "s3-ursula-artifacts" "BUCKET_HOST" | base64dec }}'
  BUCKET_NAME: '{{ fromSecret "ursula-infra" "s3-ursula-artifacts" "BUCKET_NAME" | base64dec }}'
  BUCKET_PORT: '{{ fromSecret "ursula-infra" "s3-ursula-artifacts" "BUCKET_PORT" | base64dec }}'
  BUCKET_REGION: '{{ fromSecret "ursula-infra" "s3-ursula-artifacts" "BUCKET_REGION" | base64dec }}'
  BUCKET_SUBREGION: '{{ fromSecret "ursula-infra" "s3-ursula-artifacts" "BUCKET_SUBREGION" | base64dec }}'
