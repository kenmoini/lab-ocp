---
apiVersion: policy.open-cluster-management.io/v1beta1
kind: PolicySet
metadata:
  name: ursula
  #namespace: open-cluster-management-policies
spec:
  description: "Set of policies that help deploy and manage the Ursula ensemble on OpenShift clusters."
  policies:
    - ursula-common
    - ursula-obc
    - ursula-db
    - ursula-kafka-instance
    - ursula-kafka
    - targeted-ursula-infra