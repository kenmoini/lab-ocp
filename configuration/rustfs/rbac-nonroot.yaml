kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: rustfs-nonroot
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
subjects:
  - kind: ServiceAccount
    name: hub-cluster-rustfs
    namespace: rustfs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:nonroot-v2