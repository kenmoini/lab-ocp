---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: s3-dash
  namespace: rustfs
spec:
  host: s3-dash.apps.tri-force.lab.kemo.network
  to:
    kind: Service
    name: hub-cluster-rustfs-svc
    weight: 100
  port:
    targetPort: console
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None