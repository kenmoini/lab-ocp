---
# Secret consumed by the KeycloakRealmImport `spec.placeholders` for the openshell-ci client.
# Pulled from Vault via the kemo-labs-vault ClusterSecretStore (same pattern as the RHDH realm).
# Vault key `kemo.labs/oauth/keycloak/openshell` needs a `ciClientSecret` property.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: vault-pdns
  namespace: external-dns
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshInterval: "3600s"
  secretStoreRef:
    name: kemo-labs-vault
    kind: ClusterSecretStore
  target:
    name: pdns-api-key
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
      data:
        api-key: "{{ .apiKey }}"
  data:
    - secretKey: apiKey
      remoteRef:
        key: dev.kemo/lab/services/powerdns
        property: api-key

