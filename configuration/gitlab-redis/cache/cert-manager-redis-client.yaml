---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gitlab-redis-registry-cache-client
  namespace: gitlab-infra
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  commonName: gitlab-redis-registry-cache-client
  duration: 8760h
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: redis-registry-cache-selfsigned-ca
  privateKey:
    algorithm: ECDSA
    size: 256
  renewBefore: 720h
  secretName: gitlab-redis-registry-cache-client-tls
  usages:
    - client auth
    - digital signature
    - key encipherment