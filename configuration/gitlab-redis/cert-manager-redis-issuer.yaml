---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: redis-selfsigned
  namespace: gitlab-infra
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  selfSigned: {}

---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: redis-selfsigned-ca
  namespace: gitlab-infra
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  ca:
    secretName: redis-tls-ca
