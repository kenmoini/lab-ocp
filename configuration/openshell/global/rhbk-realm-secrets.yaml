---
# Secret consumed by the KeycloakRealmImport `spec.placeholders` for the openshell-ci client.
# Pulled from Vault via the kemo-labs-vault ClusterSecretStore (same pattern as the RHDH realm).
# Vault key `kemo.labs/oauth/keycloak/openshell` needs a `ciClientSecret` property.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: vault-openshell-sso-clients
  namespace: rhbk
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshInterval: "3600s"
  secretStoreRef:
    name: kemo-labs-vault
    kind: ClusterSecretStore
  target:
    name: openshell-sso-clients
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
  data:
    - secretKey: ciClientSecret
      remoteRef:
        key: kemo.labs/oauth/keycloak/openshell
        property: ciClientSecret
    - secretKey: dashboardClientSecret
      remoteRef:
        key: kemo.labs/oauth/keycloak/openshell
        property: dashboardClientSecret
