---
# Allows use of UserNS SCC
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: openshell-userns-scc
subjects:
  - kind: ServiceAccount
    name: hub-cluster-openshell
    namespace: openshell
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: 'system:openshift:scc:nested-container'