apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: openshell-gateway-metrics
  namespace: openshell
spec:
  endpoints:
    - interval: 30s
      port: metrics
      scheme: http
      # tlsConfig:
      #   caFile: /etc/prometheus/configmaps/serving-certs-ca-bundle/service-ca.crt
      #   certFile: /etc/prometheus/secrets/metrics-client-certs/tls.crt
      #   keyFile: /etc/prometheus/secrets/metrics-client-certs/tls.key
      #   serverName: openshell-gateway-metrics.openshell.svc.cluster.local
  selector:
    matchLabels:
      app: openshell-gateway-metrics
  namespaceSelector:
    matchNames:
      - openshell