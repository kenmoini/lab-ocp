---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openshell-gateway-tls
  namespace: openshift-ingress
spec:
  commonName: openshell-gw.lab.kemo.network
  secretName: openshell-gateway-tls
  dnsNames:
    - openshell-gw.lab.kemo.network
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-digitalocean