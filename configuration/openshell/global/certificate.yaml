---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openshell-gateway-tls
  namespace: openshift-ingress
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  commonName: openshell-gw.apps.tri-force.lab.kemo.network
  secretName: openshell-gateway-tls
  dnsNames:
    - openshell-gw.apps.tri-force.lab.kemo.network
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-digitalocean