---
apiVersion: v1
kind: Service
metadata:
  name: openshell-gateway-metrics
  namespace: openshell
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: openshell-gateway-metrics-tls
  labels:
    app: openshell-gateway-metrics
spec:
  ipFamilies:
    - IPv4
  ports:
    - name: metrics
      protocol: TCP
      port: 9090
      targetPort: metrics
  type: ClusterIP
  ipFamilyPolicy: SingleStack
  selector:
    app.kubernetes.io/instance: hub-cluster-openshell
    app.kubernetes.io/name: openshell
